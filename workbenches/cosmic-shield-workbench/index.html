<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cosmic Shield · 盾牌预设工作台</title>
<style>
:root{color-scheme:dark;--bg:#090e18;--panel:#121b2b;--line:#2c405c;--text:#e7f1ff;--muted:#91a8c7;--accent:#49d6f4}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -15%,#1d395b 0,#0b1322 42%,var(--bg) 90%);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif;color:var(--text)}
header{max-width:1250px;margin:auto;padding:32px 24px 12px}h1{font-size:clamp(27px,4vw,44px);line-height:1.1;margin:0 0 8px;letter-spacing:.02em}p{margin:0;color:var(--muted)}main{max-width:1250px;margin:auto;padding:20px 24px 40px;display:grid;grid-template-columns:minmax(340px,1.1fr) minmax(350px,.9fr);gap:20px}
.panel{background:linear-gradient(145deg,#172438f2,#101826f2);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 60px #0005;overflow:hidden}.panel h2{font-size:16px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 14px}.preview{padding:20px}.stage{height:430px;display:grid;place-items:center;border:1px solid #29425e;border-radius:13px;background:radial-gradient(circle at 50% 38%,#263d5b 0,#101928 48%,#090d15 100%);position:relative;overflow:hidden}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#ffffff04 1px,transparent 1px),linear-gradient(#ffffff04 1px,transparent 1px);background-size:24px 24px}.stage canvas{position:relative;max-width:100%;height:390px;filter:drop-shadow(0 25px 22px #000b)}.stage-label{position:absolute;left:16px;bottom:13px;color:#aec9e6;font:12px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.08em}.controls{padding:20px;display:grid;gap:18px}.control-label{display:block;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip,button{cursor:pointer;color:var(--text);background:#172741;border:1px solid #39516e;border-radius:9px;padding:9px 13px;font:inherit}.chip[aria-pressed=true],.card[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 20px #32b6ed22}.chip:hover,.card:hover,button:hover{background:#203550}.toggle{display:flex;align-items:center;gap:10px;color:var(--muted)}input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px}.cards{padding:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{text-align:left;background:#101c2e;border:1px solid #30445f;border-radius:12px;padding:13px;min-height:105px;color:var(--text);cursor:pointer}.card strong{display:block;font-size:16px}.card span{display:block;color:var(--muted);font-size:12px;margin-top:5px}.meta{padding:20px;border-top:1px solid var(--line)}.meta p{margin:5px 0}.command{display:flex;align-items:stretch;gap:8px;margin-top:12px}code{display:block;min-width:0;flex:1;background:#09111d;border:1px solid #30445f;border-radius:8px;padding:11px;color:#c4eaff;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,Consolas,monospace}button.copy{white-space:nowrap}.note{font-size:12px;margin-top:11px}.legend{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;color:var(--muted);font-size:12px}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}.footer{max-width:1250px;margin:0 auto 35px;padding:0 24px;color:#718ba8;font-size:12px}@media(max-width:860px){main{grid-template-columns:1fr}.stage{height:350px}.stage canvas{height:315px}}@media(max-width:460px){main,header{padding-left:14px;padding-right:14px}.cards{grid-template-columns:1fr}.command{flex-direction:column}}
</style>
</head>
<body>
<header><h1>Cosmic Shield <span style="color:#7edff6">/ 盾牌预设工作台</span></h1><p>比较完整宇宙盾面与保留原版金属边框的版本。预览用于选型；游戏截图和实际着色以 Forge 1.20.1 运行为准。</p></header>
<main>
  <section class="panel preview" aria-label="盾牌预览"><h2>实时预览</h2><div class="stage"><canvas id="shield" width="420" height="540" aria-label="所选 Cosmic 盾牌预设"></canvas><div class="stage-label" id="stageLabel"></div></div></section>
  <section class="panel">
    <div class="controls"><div><span class="control-label">配色 · 游戏内 Palette</span><div class="chips" id="palettes"></div></div><label class="toggle"><input id="animate" type="checkbox" checked> 播放星点闪烁与缓慢流动</label><div class="legend"><div><i class="swatch" style="background:#8db2ca"></i>保留原版金属边框</div><div><i class="swatch" style="background:#49d6f4"></i>Cosmic 内部场</div><div><i class="swatch" style="background:#f3eef9"></i>原版纹章图案</div></div></div>
    <div class="cards" id="presets"></div>
    <div class="meta"><h2 id="presetTitle"></h2><p id="presetDetail"></p><div class="command"><code id="command"></code><button class="copy" id="copy">复制 /give</button></div><p class="note">盾牌样式由 <code style="display:inline;border:0;padding:0;background:none">CosmicMaterial.ShieldStyle</code> 决定：缺省为完整 Cosmic，<code style="display:inline;border:0;padding:0;background:none">framed</code> 保留原版金属边框。纹章由原版 <code style="display:inline;border:0;padding:0;background:none">BlockEntityTag</code> 绘制。</p></div>
  </section>
</main>
<div class="footer">独立 HTML 文件，可直接双击打开。预览用 Canvas 2D 表达层次，不承担游戏内 shader 的像素级一致性验证。</div>
<script>
const presets=[
  {id:'full',name:'完整 Cosmic',hint:'盾面与边框均进入 Cosmic',detail:'原始全覆盖预设；适合整块盾牌都像宇宙窗口。',framed:false,pattern:false},
  {id:'framed',name:'金属边框 Cosmic',hint:'保留金属边框，内部为 Cosmic',detail:'新增的 ShieldStyle:"framed" 预设。金属边缘保留原版纹理，中心仍是动态宇宙。',framed:true,pattern:false},
  {id:'pattern',name:'纹章 Cosmic',hint:'Cosmic 底色 + 原版白色底条',detail:'纹章的不透明底色由 Cosmic 替代，图案层继续使用原版盾牌渲染。',framed:false,pattern:true},
  {id:'framed-pattern',name:'边框 + 纹章',hint:'保留金属边框与原版纹章',detail:'完整组合：原版金属框、动态 Cosmic 盾面、原版纹章图案。',framed:true,pattern:true}
];
const palettes={violet:{name:'蓝紫星海',base:['#142c64','#2467ae','#67a3fa'],star:'#b4dcff'},gold:{name:'熔金星海',base:['#39230e','#8b5311','#f0ad29'],star:'#ffe2a0'},cyan:{name:'青蓝星海',base:['#062e3d','#0b6983','#3bd6ed'],star:'#a7faff'}};
let selected=1,palette='cyan',running=true,clock=0,last=0;
const canvas=document.getElementById('shield'),ctx=canvas.getContext('2d');
const stars=Array.from({length:260},(_,i)=>{let x=Math.sin(i*127.1+3.4)*43758.5453,y=Math.sin(i*71.7+48.2)*24621.91,s=Math.sin(i*9.3+19.9)*18342.17;return{x:x-Math.floor(x),y:y-Math.floor(y),size:0.4+(s-Math.floor(s))*2.8,phase:i*1.81}});
function path(){ctx.beginPath();ctx.moveTo(101,28);ctx.lineTo(319,28);ctx.lineTo(344,68);ctx.lineTo(334,425);ctx.lineTo(210,517);ctx.lineTo(86,425);ctx.lineTo(76,68);ctx.closePath()}
function field(p){ctx.save();path();ctx.clip();let g=ctx.createLinearGradient(70,65,345,485);g.addColorStop(0,p.base[0]);g.addColorStop(.5,p.base[1]);g.addColorStop(1,p.base[0]);ctx.fillStyle=g;ctx.fillRect(60,20,300,500);for(let i=0;i<5;i++){let x=100+i*52+Math.sin(clock*.12+i)*12,y=90+i*84;let a=ctx.createRadialGradient(x,y,2,x,y,120);a.addColorStop(0,p.base[2]+'66');a.addColorStop(1,p.base[2]+'00');ctx.fillStyle=a;ctx.fillRect(60,25,300,490)}for(const s of stars){let x=82+s.x*255+Math.sin(clock*.07+s.phase)*3,y=38+s.y*460,glow=.42+.34*Math.sin(clock*1.4+s.phase);ctx.fillStyle=p.star;ctx.globalAlpha=Math.max(.14,glow);ctx.fillRect(x,y,s.size,s.size);if(s.size>2.55){ctx.fillRect(x-3,y+s.size/2,8,0.8);ctx.fillRect(x+s.size/2,y-3,.8,8)}}ctx.globalAlpha=1;ctx.restore()}
function frame(){ctx.save();path();ctx.strokeStyle='#364b5b';ctx.lineWidth=22;ctx.stroke();path();ctx.strokeStyle='#98a9b8';ctx.lineWidth=15;ctx.stroke();path();ctx.strokeStyle='#d3dee6';ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle='#7b8b9c';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(105,43);ctx.lineTo(315,43);ctx.moveTo(93,72);ctx.lineTo(101,420);ctx.lineTo(210,501);ctx.stroke();for(const [x,y] of [[95,74],[325,74],[100,420],[320,420],[210,497]]){ctx.fillStyle='#435260';ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#dbe5ee';ctx.fillRect(x-1,y-2,2,2)}ctx.restore()}
function stripe(){ctx.save();path();ctx.clip();ctx.translate(0,8);ctx.fillStyle='#efedf5';ctx.beginPath();ctx.moveTo(89,320);ctx.lineTo(331,320);ctx.lineTo(329,398);ctx.lineTo(91,398);ctx.closePath();ctx.fill();ctx.strokeStyle='#d5d2e3';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
function render(){const preset=presets[selected],p=palettes[palette];ctx.clearRect(0,0,420,540);ctx.fillStyle='#0006';ctx.beginPath();ctx.ellipse(210,524,145,10,0,0,Math.PI*2);ctx.fill();field(p);if(preset.pattern)stripe();if(preset.framed)frame();else{path();ctx.strokeStyle=p.base[2];ctx.globalAlpha=.5;ctx.lineWidth=7;ctx.stroke();ctx.globalAlpha=1}ctx.save();ctx.strokeStyle='#ffffff18';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(122,48);ctx.lineTo(295,48);ctx.stroke();ctx.restore();document.getElementById('stageLabel').textContent=preset.name+'  /  '+p.name}
function give(){const s=presets[selected],style=s.framed?',ShieldStyle:"framed"':'';const pattern=s.pattern?',BlockEntityTag:{Base:14,Patterns:[{Pattern:"bs",Color:0}]}':'';return `/give @s minecraft:shield{CosmicMaterial:{Palette:"${palette}"${style}}${pattern}} 1`}
function select(i){selected=i;document.querySelectorAll('.card').forEach((el,n)=>el.setAttribute('aria-pressed',n===i));document.getElementById('presetTitle').textContent=presets[i].name;document.getElementById('presetDetail').textContent=presets[i].detail;document.getElementById('command').textContent=give();render()}
document.getElementById('presets').innerHTML=presets.map((p,i)=>`<button class="card" type="button" data-i="${i}" aria-pressed="false"><strong>${p.name}</strong><span>${p.hint}</span></button>`).join('');
document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>select(+el.dataset.i)));
document.getElementById('palettes').innerHTML=Object.entries(palettes).map(([k,p])=>`<button class="chip" type="button" data-p="${k}" aria-pressed="false">${p.name}</button>`).join('');
document.querySelectorAll('.chip').forEach(el=>el.addEventListener('click',()=>{palette=el.dataset.p;document.querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',b===el));select(selected)}));
document.getElementById('animate').addEventListener('change',e=>{running=e.target.checked});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(give())}catch{const range=document.createRange();range.selectNodeContents(document.getElementById('command'));const sel=getSelection();sel.removeAllRanges();sel.addRange(range);document.execCommand('copy');sel.removeAllRanges()}const b=document.getElementById('copy');b.textContent='已复制';setTimeout(()=>b.textContent='复制 /give',1600)});
document.querySelector('[data-p="cyan"]').setAttribute('aria-pressed','true');select(1);
function tick(now){if(running){clock+=Math.min(0.05,(now-last)/1000||0);render()}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script>
</body>
</html>
