plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.rendercraft'
version = '0.1.0'
base { archivesName = 'bloomlab' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft { mappings channel: 'official', version: '1.20.1' }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
