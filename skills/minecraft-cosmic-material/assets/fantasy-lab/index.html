.catalog{grid-template-columns:repeat(6,minmax(0,1fr))}

<body><main>
<header><h1>奇幻材质工坊<small id="catalog-count">FANTASY & COSMIC</small></h1><div class="header-actions" id="fantasy-actions"><button id="import">导入配方</button><button id="export">导出配方</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></header>
<nav class="family-tabs" aria-label="材质类别"><button data-family="fantasy" aria-pressed="true">奇幻材质<span id="fantasy-count"></span></button><button data-family="cosmic" aria-pressed="false">内部星空<span>03</span></button></nav>
<div id="fantasy-workspace">
<nav class="catalog" id="presets" aria-label="材质库"></nav>
<div class="workspace"><section class="viewer" aria-label="材质预览">
<div class="viewbar"><div class="segmented" aria-label="载体"><button data-shape="0" aria-pressed="true">材质面</button><button data-shape="1" aria-pressed="false">剑刃</button><button data-shape="2" aria-pressed="false">封存球</button></div><div class="tools"><button class="icon-button" id="reset-view" title="复位视角" aria-label="复位视角">↺</button><button class="icon-button" id="motion" title="暂停" aria-label="暂停">Ⅱ</button></div></div>
<div class="stage"><canvas id="scene" width="800" height="540" aria-label="动态材质"></canvas></div>
<div class="under-stage"><div class="current"><h2 id="material-name"></h2><p id="mechanism"></p></div><div class="sample-strip"><div class="sample"><canvas id="icon16" width="16" height="16" aria-label="16像素剑刃"></canvas><span>16 × 16</span></div><div class="sample"><canvas id="icon32" width="32" height="32" aria-label="32像素剑刃"></canvas><span>32 × 32</span></div></div></div>
</section><aside class="panel"><div class="panel-heading"><h2>材质参数</h2><button id="reset-material">还原材质</button></div><div class="sliders" id="sliders"></div><div class="seed-row"><label for="seed">布局种子</label><input id="seed" type="number" min="0" max="65535" step="1"></div><div class="colors" id="colors"></div><p class="status" id="status" role="status">载入中</p></aside></div>
<footer><span id="state-readout"></span><span>原创程序材质 · Forge 1.20.1 独立验收</span></footer>
</div><iframe id="cosmic-workspace" title="内部星空材质" hidden></iframe>
</main><script src="ocean-spectrum.js"></script><script type="module" src="preview.js"></script></body></html>
