<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>物品描边 · Outline Studio</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e6e8ec;background:#151719;font-size:14px;letter-spacing:0}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button,select,input[type=number]{color:inherit;background:#262a2e;border:1px solid #454b50;border-radius:4px;padding:7px}button{cursor:pointer}button:hover{background:#374046}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #64d6bc}header{min-height:66px;padding:16px 24px;border-bottom:1px solid #353a3f;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:19px;margin:0}header span{font-size:12px;color:#aab2b9}main{display:grid;grid-template-columns:minmax(0,1fr) 300px;max-width:1500px;margin:auto}.viewer{padding:24px;min-width:0}.controls{padding:22px;border-left:1px solid #353a3f;background:#1d2023}h2{font-size:14px;margin:0 0 16px;color:#aab2b9;font-weight:500}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.icon{width:36px;height:36px;display:inline-grid;place-items:center;padding:7px}.icon svg{width:19px;height:19px}.stage{position:relative;display:grid;place-items:center;margin:18px 0;background:#22282c;min-height:320px;height: min(61vh,620px);overflow:hidden;border:1px solid #394147;border-radius:4px}.stage.light{background:#c8ced0}.stage.grid{background-color:#22282c;background-image:linear-gradient(45deg,#2b3237 25%,transparent 25%,transparent 75%,#2b3237 75%),linear-gradient(45deg,#2b3237 25%,transparent 25%,transparent 75%,#2b3237 75%);background-size:32px 32px;background-position:0 0,16px 16px}.stage canvas{width:min(100%,520px);height:auto;aspect-ratio:1;image-rendering:pixelated}.views{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #353a3f;padding:0 0 20px}.sample{display:grid;grid-template-columns:72px auto;align-items:center;gap:10px;color:#aab2b9;font-size:12px}.sample canvas{width:64px;height:64px;image-rendering:pixelated;background:#22282c}.time{margin-top:18px;display:flex;align-items:center;gap:10px}.time input[type=range]{flex:1;min-width:50px}.time input[type=number]{width:78px}fieldset{border:0;padding:0;margin:0 0 22px}legend{font-weight:600;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}.row select{max-width:165px}label{color:#c7ced4}input[type=range]{width:100%;accent-color:#64d6bc}input[type=checkbox]{accent-color:#64d6bc}output{font-variant-numeric:tabular-nums;color:#64d6bc}input[type=color]{width:42px;height:34px;padding:2px;border:1px solid #58616a;background:none;border-radius:4px}.palette{display:flex;gap:12px}.palette label{display:grid;gap:5px;font-size:11px}.status{min-height:24px;color:#e8b76f;margin:12px 0;font-size:12px}.file{display:none}footer{padding:12px 24px;border-top:1px solid #353a3f;font-size:12px;color:#8d999f}button[disabled]{opacity:.4;cursor:default}@media(max-width:760px){main{grid-template-columns:1fr}.controls{border-left:0;border-top:1px solid #353a3f;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.viewer{padding:14px}.stage{height:auto;aspect-ratio:1;min-height:0}fieldset{min-width:0}.row{flex-wrap:wrap}.row select{max-width:100%;width:100%}header{padding:14px}footer{padding:12px 14px}}@media(max-width:420px){.controls{grid-template-columns:1fr}.stage canvas{width:100%}}
</style></head><body>
<header><h1>物品描边 <span>Outline Studio</span></h1><div class="tools"><button id="import" class="icon" title="导入配方" aria-label="导入配方"><i data-lucide="folder-open"></i></button><button id="export" class="icon" title="导出配方" aria-label="导出配方"><i data-lucide="file-down"></i></button><button id="png" class="icon" title="导出透明 PNG" aria-label="导出透明 PNG"><i data-lucide="image-down"></i></button><button id="reset" class="icon" title="重置" aria-label="重置"><i data-lucide="rotate-ccw"></i></button></div></header>
<div style="padding:10px 24px;background:#443316;border-bottom:1px solid #85642b;color:#ffe5ad;font-size:13px">这是二维配色与轮廓草图，不能代表 ArcaneVortex 的三维物品效果。Forge 1.20.1 实际描边请在游戏里运行 <code>/cosmicmaterial outline</code>；两套宽度单位不同。</div>
<main><section class="viewer"><div class="tools"><select id="preset" aria-label="配方"><option value="gold">鎏金细边</option><option value="flow">青红流彩</option><option value="stars">星海边缘</option><option value="rainbow">虹彩变色</option></select><select id="background" aria-label="背景"><option value="grid">棋盘背景</option><option value="dark">深色背景</option><option value="light">浅色背景</option></select></div><div class="stage grid" id="stage"><canvas id="preview" width="256" height="256" aria-label="描边主预览"></canvas></div><div class="views"><div class="sample"><canvas id="small16" width="16" height="16"></canvas><span>16 × 16</span></div><div class="sample"><canvas id="small32" width="32" height="32"></canvas><span>32 × 32</span></div><div class="sample"><canvas id="original" width="64" height="64"></canvas><span>原始轮廓</span></div></div><div class="time"><button id="play" class="icon" title="暂停" aria-label="暂停"><i data-lucide="pause"></i></button><input id="timeline" aria-label="时间轴" type="range" min="0" max="60" step="0.01" value="0"><input id="time" aria-label="时间（秒）" type="number" min="0" max="60" step="0.01" value="0"><span>s</span></div><div id="status" class="status" role="status"></div></section>
<aside class="controls"><fieldset><legend>物品</legend><label class="row">轮廓<select id="shape"><option value="sword">剑</option><option value="axe">斧</option><option value="ring">环形饰物</option><option value="custom" disabled>自定义 PNG</option></select></label><button id="texture">导入透明 PNG</button><label class="row">主体<input id="body" type="checkbox" checked></label><label class="row">描边<input id="edge" type="checkbox" checked></label></fieldset>
<fieldset><legend>轮廓</legend><label class="row" for="width">宽度 · 32px 基准<output id="widthValue"></output></label><input id="width" type="range" min="0" max="4" step="0.1"><label class="row" for="opacity">透明度<output id="opacityValue"></output></label><input id="opacity" type="range" min="0" max="1" step="0.01"><label class="row" for="angle">旋转<output id="angleValue"></output></label><input id="angle" type="range" min="-180" max="180" step="1"></fieldset>
<fieldset><legend>材质</legend><label class="row">模式<select id="mode"><option value="solid">纯色</option><option value="flow">三色流动</option><option value="stars">星海</option><option value="rainbow">整体彩虹</option></select></label><div class="palette"><label>主色<input id="color0" type="color"></label><label>辅色<input id="color1" type="color"></label><label>亮色<input id="color2" type="color"></label></div><label class="row" for="scale">图案尺度<output id="scaleValue"></output></label><input id="scale" type="range" min="0.5" max="6" step="0.1"><label class="row" for="speed">速度<output id="speedValue"></output></label><input id="speed" type="range" min="0" max="3" step="0.05"></fieldset></aside></main>
<footer>二维轮廓设计预览 · 配方 v1</footer><input id="recipeFile" class="file" type="file" accept="application/json,.json"><input id="imageFile" class="file" type="file" accept="image/png">
<script src="lucide.min.js"></script><script src="preview.js"></script></body></html>
