<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>黑洞材质工作台 · v3.2</title>
<style>
:root{color-scheme:dark;font:14px/1.5 system-ui,sans-serif;background:#151618;color:#e8e9eb;letter-spacing:0}*{box-sizing:border-box}body{max-width:1600px;margin:0 auto;padding:18px 24px}header{display:flex;align-items:baseline;gap:14px;border-bottom:1px solid #3d4044;padding-bottom:14px;margin-bottom:16px}h1{font-size:22px;margin:0}header span{color:#e7bd71;font-size:12px}main{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:24px}section{min-width:0;position:sticky;top:16px;align-self:start}canvas{display:block;width:100%;background:#03040a}#scene{height:auto;touch-action:none;border:1px solid #32363d;border-radius:8px}aside{min-width:0;border-left:1px solid #3d4044;padding-left:20px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}label{display:flex;align-items:center;justify-content:space-between;margin:10px 0;gap:8px;font-size:13px}input[type=range]{width:145px;min-width:90px;accent-color:#ecbb6b}select,button,input[type=number]{background:#26282b;border:1px solid #55585e;color:inherit;padding:7px;border-radius:4px;max-width:100%}select{max-width:205px}button{cursor:pointer;margin:3px 3px 3px 0}button:hover{border-color:#ecbb6b}output{font-size:12px;color:#bbc3cb;width:40px;flex-shrink:0;text-align:right}.small{display:flex;align-items:center;gap:14px;margin-top:12px}.small canvas{width:48px;height:48px;aspect-ratio:1;image-rendering:pixelated;border:1px solid #4d5258}.note{font-size:12px;color:#bbc3cb}#status{white-space:pre-wrap;overflow-wrap:anywhere}details{border-top:1px solid #3d4044;padding:12px 0}summary{cursor:pointer;color:#e7bd71;font-size:14px}.color-group{border-top:1px solid #34383d;padding-top:5px;margin-top:10px}.color-group strong{font-size:11px;color:#bbc3cb;font-weight:500}.actions{padding:10px 0;border-top:1px solid #3d4044}input[type=color]{width:45px;height:28px;padding:1px;border:1px solid #55585e;background:transparent}input[type=checkbox]{accent-color:#ecbb6b}input[type=file]{font-size:11px;min-width:0;width:210px}@media(max-width:800px){body{padding:12px}main{grid-template-columns:1fr;gap:16px}section{position:static}aside{max-height:none;overflow:visible;border-left:0;padding-left:0}h1{font-size:20px}select{max-width:200px}input[type=range]{width:45%}}
</style>
<header><h1>黑洞材质工作台</h1><span>v3.2 · 2026.10.03</span></header>
<main><section><canvas id="scene" width="960" height="600" aria-label="黑洞实时材质"></canvas><p class="note">拖动旋转视角，鼠标滚轮拉近或拉远。</p><div class="small"><canvas id="small16" width="16" height="16"></canvas><span>16 px</span><canvas id="small32" width="32" height="32"></canvas><span>32 px</span></div><p id="status" class="note">正在编译…</p><div class="actions"><button id="play">播放</button><button id="reset">恢复配方视角</button><button id="random">随机方案</button><button id="export">导出配方</button><button id="capture">保存画面</button></div></section>
 <aside><label>主配方<select id="recipe"></select></label><p class="note">主配方按三类盘面算法整理；颜色、光圈、渐变和粒子强度请直接在右侧调整。旧链接与导入的兼容变体会保留为隐藏选项。世界配方中的尺寸、放置距离和玩家透镜选项会保留并随配方重导。</p><label>视图<select id="mode"><option value="scene">内部空间</option><option value="blade">剑刃窗口</option></select></label>
<label>盘面结构<select id="diskStyle"><option value="dust">透镜尘埃</option><option value="ribbons">基础光带</option><option value="granular">颗粒吸积盘</option><option value="classic">经典条带</option></select></label>
<label>背景<select id="backgroundStyle"><option value="nebula">弥散星云</option><option value="stars">稀疏星点</option><option value="black">纯黑</option></select></label>
<label>检查画面<select id="diagnostic"><option value="0">完整合成</option><option value="2">仅盘面与核心</option><option value="3">仅透镜背景</option><option value="1">射线：捕获 / 耗尽 / 透射</option></select></label>
<label>预览画幅<select id="aspect"><option value="wide">横向 16:10</option><option value="cinema">影院 16:9</option><option value="square">方形 1:1</option></select></label>
<details open><summary>构图与透镜</summary><label>背景引力透镜<input id="lensEnabled" type="checkbox" checked></label><p class="note">开关与范围只控制背景偏折；吸积盘的弯曲光路由“偏折强度”控制。</p><div id="compositionControls"></div>
<label>核心内部色<input id="coreColor" type="color" value="#000000"></label><label>核心边缘色<input id="coreEdgeColor" type="color" value="#000000"></label>
</details><details open><summary>盘纹与发光</summary><div id="controls"></div>
<label>盘内热色<input id="hot" type="color"></label><label>盘中间色<input id="diskMid" type="color"></label><label>盘外冷色<input id="cool" type="color"></label>
</details><details><summary>旋转与内流</summary><div id="motionControls"></div></details><details><summary>额外轨道粒子</summary><label>启用叠加<input id="particles" type="checkbox"></label><div id="particleControls"></div><label>内层粒子色<input id="particleHot" type="color"></label><label>中层粒子色<input id="particleMid" type="color"></label><label>外层粒子色<input id="particleCold" type="color"></label></details>
<details open><summary>黑洞周围光圈与光晕</summary><div id="haloControls"></div><div class="color-group"><strong>内缘光圈</strong><label>光圈内侧色<input id="haloGradientStart" type="color"></label><label>光圈外侧色<input id="haloGradientEnd" type="color"></label></div><div class="color-group"><strong>盘侧辐射</strong><label>盘侧内侧色<input id="haloDiskInnerColor" type="color"></label><label>盘侧外侧色<input id="haloDiskOuterColor" type="color"></label></div><div class="color-group"><strong>外围柔光</strong><label>柔光内侧色<input id="haloAuraInnerColor" type="color"></label><label>柔光外侧色<input id="haloAuraOuterColor" type="color"></label></div></details>
<details><summary>极轴喷流</summary><p class="note">默认关闭；独立调节上下喷流的长度、宽度及基部到末端的颜色渐变。</p><div id="jetControls"></div><label>喷流基部色<input id="jetBaseColor" type="color"></label><label>喷流末端色<input id="jetTipColor" type="color"></label></details>
<details open><summary>背景颜色渐变</summary><div id="skyControls"></div><label>近景星域色<input id="skyColor" type="color"></label><label>远景星域色<input id="skyColorFar" type="color"></label></details>
<details open><summary>镜头与曝光</summary><div id="postControls"></div></details>
<div class="actions">
<label>质量<select id="steps"><option>96</option><option selected>160</option><option>256</option></select></label>
<label>时间<input id="time" type="number" min="0" max="100000" step="0.1" value="1.7" style="width:105px"></label>
<label>导入配方<input id="import" type="file" accept=".json" style="width:180px"></label>
</div></aside></main>
<script src="postprocess.js"></script><script src="layers.js"></script><script src="preview.js"></script></html>
