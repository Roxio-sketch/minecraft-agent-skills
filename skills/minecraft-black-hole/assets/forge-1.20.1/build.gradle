plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
group = 'dev.blackholelab'
version = '0.1.0'
base { archivesName = 'black-hole-lab' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
minecraft {
    mappings channel: 'official', version: '1.20.1'
    runs { client {
        workingDirectory project.file('run')
        property 'forge.logging.console.level', 'info'
        property 'blackholelab.groundRegression', project.findProperty('blackHoleGroundRegression') ?: 'false'
        mods { blackholelab { source sourceSets.main } }
    } }
}
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.10' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.register('blackHoleCheck', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.blackholelab.BlackHoleCheck'
    if (project.hasProperty('recipeEvidence')) args project.property('recipeEvidence')
    if (project.hasProperty('recipeRoundtrip')) args project.property('recipeRoundtrip')
}
