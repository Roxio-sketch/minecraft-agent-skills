<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>御剑术 · 三维原型</title><link rel="stylesheet" href="style.css"><body><header><a href="../index.html">仙途 / 资源工作台</a><span class="tag">形态原型 · 无伤害 · 未接入游戏</span><span id="gpu">初始化 WebGL2…</span></header><main><section class="stage"><canvas id="scene" aria-label="御剑技能三维原型"></canvas><div class="caption"><span id="phase">起势</span><strong id="title">九霄剑决</strong><p id="desc"></p></div><div class="hint">拖动旋转 · 滚轮缩放 · 空格暂停</div></section><aside><small>SWORD FORMATION / 01</small><h1>御剑术原型</h1><p class="intro">先看剑阵的空间形态、运动节奏和拖尾。人物使用原创通用演示皮肤，飞剑使用模组当前法器剑模型与原贴图。</p><div class="tabs"><button id="longyuan" class="active">九霄剑决</button><button id="wanjian">万剑归宗</button></div><div class="controls"><button id="play">暂停</button><button id="replay">重播</button><button id="view">拉远全景</button></div><div class="controls"><button id="inspect">人物动作近景</button></div><label class="check"><input id="sockets" type="checkbox">显示剑端挂点（绿：剑刃，红：拖尾端）</label><label class="check"><input id="particles" type="checkbox" checked>白金伴随粒子</label><label class="check"><input id="bloom" type="checkbox" checked>选择性辉光</label><label>辉光强度 <input id="glow" type="range" min="0" max="1.5" step="0.05" value="0.65"></label><label class="timeline">演出时间 <output id="clock">0.0 / 10.0 s</output><input id="time" type="range" min="0" max="10" step="0.01" value="0"></label><label>剑群密度 <output id="densityOut">标准</output><input id="density" type="range" min="0" max="2" step="1" value="1"></label><label>拖尾长度 <output id="tailOut">1.00×</output><input id="tail" type="range" min="0.3" max="1.8" step="0.05" value="1"></label><label>旋转速度 <output id="rotationOut">1.00×</output><input id="rotation" type="range" min="0.2" max="3" step="0.05" value="1"></label><label>播放速度 <select id="speed"><option value="0.5">0.5× 慢放</option><option value="1" selected>1× 正常</option><option value="1.5">1.5×</option></select></label><label class="check"><input id="loop" type="checkbox" checked>循环演示</label><label class="check"><input id="trails" type="checkbox" checked>显示剑光拖尾</label><div class="card"><h3 id="noteTitle">高空剑幕</h3><p id="note"></p></div><div class="stats"><span>可见飞剑 <b id="count">0</b></span><span>帧率 <b id="fps">—</b></span></div><p class="foot">独立 WebGL2 三维预览。白金剑刃与粒子输出独立发光缓冲，经过深度约束模糊与亮度压缩；尚未接入游戏。</p><div id="error" role="alert"></div></aside></main><script type="module" src="app.js"></script></body></html>
