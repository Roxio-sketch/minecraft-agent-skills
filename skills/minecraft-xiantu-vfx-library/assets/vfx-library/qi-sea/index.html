<!doctype html><html lang="zh"><meta charset="utf-8"><title>仙途 · 气海着色器</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1419;color:#e3dac4;font:15px system-ui}main{max-width:1100px;margin:24px auto;padding:20px}h1{font-size:24px;color:#d6bd82}section{display:grid;grid-template-columns:minmax(280px,650px) 300px;gap:24px}canvas{width:100%;aspect-ratio:1;display:block;border:1px solid #766449;background:#101d22}.panel{padding:20px;background:#16272a;border:1px solid #59634e}label{display:block;margin:18px 0 6px}input,select{width:100%}select,button{padding:9px;background:#263b36;color:#e3dac4;border:1px solid #9d895a}button{margin:8px 6px 0 0}.small{color:#91b7a8;font-size:13px;line-height:1.8}output{float:right;color:#dfc988}#status{margin:16px 0;color:#80c9af}@media(max-width:800px){section{grid-template-columns:1fr}}</style><main><h1>内景 · 气海着色器</h1><p class="small">共用游戏实际 GLSL 片元代码。五行各自的当前修为控制旋转与亮度；灵力控制充盈。此处为可调参数预览，不修改存档。</p><section><canvas id="view" width="650" height="650"></canvas><div class="panel"><label for="root">灵根</label><select id="root"><option value="five">五行灵根</option><option value="metal">金灵根</option><option value="wood">木灵根</option><option value="water">水灵根</option><option value="fire">火灵根</option><option value="earth">土灵根</option><option value="thunder">雷灵根</option><option value="sword">剑灵根</option><option value="heaven">天灵根</option><option value="mixed">杂灵根</option><option value="none">无灵根</option></select><label>当前阶段修为 <output id="progressValue">50%</output></label><input id="progress" aria-label="当前阶段修为" type="range" min="0" max="100" value="50"><label>灵力储量 <output id="manaValue">100%</output></label><input id="mana" aria-label="灵力储量" type="range" min="0" max="100" value="100"><div id="seas"></div><button id="low">初入 · 0%</button><button id="half">半修 · 50%</button><button id="full">圆满 · 100%</button><button id="pause">暂停</button><p id="status">正在编译 GPU 着色器…</p><p class="small">金：上方 · 木：左方 · 水：右方<br>火：左下 · 土：右下<br>五行玉盘保留五行饰件；其他灵根使用去除饰件的玉盘。</p><p class="small">相位连续积分，切换修为时平滑加速。暂无 Minecraft 实机验收。</p></div></section><script src="preview.js"></script></main></html>
