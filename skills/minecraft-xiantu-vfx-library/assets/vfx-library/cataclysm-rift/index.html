<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>焚空裂隙 · 视频参考特效</title><link rel="stylesheet" href="style.css"></head><body><main><header><a href="../index.html">仙途 / 特效工作站</a><span>SHADER + TEXTURE</span><h1>焚空裂隙</h1><p>炽金圆环 · 空间撕裂 · 层叠波动</p></header><section id="stage"><canvas id="view" aria-label="裂隙着色器实时预览"></canvas><div class="stage-top"><span class="badge">实时着色器</span><span id="status">正在加载…</span></div><div class="stage-bottom"><span id="phase">持续态</span><span>拖动观察 · 滚轮缩放</span></div><div id="error" role="alert"></div></section><aside><div class="heading"><b>波动与形态</b><button id="reset">恢复参考</button></div><div id="controls"></div><label class="select">测试背景<select id="background"><option value="0">赤色云海</option><option value="1">方格 / 折射检查</option><option value="2">纯黑 / 特效检查</option></select></label><label class="select">渲染质量<select id="quality"><option value="1">标准</option><option value="0.65">流畅</option><option value="1.5">精细</option></select></label><label class="check"><input type="checkbox" id="glitch" checked>圆环横向错层</label><label class="check"><input type="checkbox" id="bloom" checked>选择性辉光</label><p class="note">轮廓尺寸固定，波动沿边缘传播：局部起伏、光带厚薄、分层流光与折射。辉光仅取裂隙发光层。网页背景用于检验折射，未接入游戏。</p></aside><footer><button id="pause">暂停</button><button id="replay">重播开合</button><button id="shot">保存画面</button><button id="export">导出参数</button><label class="time">时间 <input id="time" type="range" min="0" max="20" step="0.01" value="6"><output id="clock">6.00s</output></label></footer></main><script type="module" src="app.js"></script></body></html>
