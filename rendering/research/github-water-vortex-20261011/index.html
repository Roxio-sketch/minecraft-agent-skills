ENERATE_SYSTEM_MAPS\n}\n\n\nfunc _enter_tree() -> void:\n\tget_popup().clear()\n\tget_popup().connect(\"id_pressed\", self, \"_menu_item_selected\")\n\tget_popup().add_item(\"Generate System Maps\")\n\n\nfunc _exit_tree() -> void:\n\tget_popup().disconnect(\"id_pressed\", self, \"_menu_item_selected\")\n\n\nfunc _menu_item_selected(index : int) -> void:\n\tmatch index:\n\t\tRIVER_MENU.GENERATE_SYSTEM_MAPS:\n\t\t\temit_signal(\"generate_system_maps\")\n", "flow/Waterways/addons/waterways/inspector_plugin.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\nextends EditorInspectorPlugin\n\nconst RiverManager = preload(\"res://addons/waterways/river_manager.gd\")\nvar _editor = load(\"res://addons/waterways/editor_property.gd\")\n\n\nfunc can_handle(object: Object) -> bool:\n\treturn object is RiverManager\n\n\nfunc parse_property(object: Object, type: int, path: String, hint: int, hint_text: String, usage: int) -> bool:\n\tif type == TYPE_TRANSFORM and \"color\" in path:\n\t\tvar editor_property = _editor.new()\n\t\tadd_property_editor(path, editor_property)\n\t\treturn true\n\treturn false\n", "flow/Waterways/addons/waterways/plugin.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\ntool\nextends EditorPlugin\n\nconst WaterHelperMethods = preload(\"./water_helper_methods.gd\")\nconst WaterSystem = preload(\"./water_system_manager.gd\")\nconst RiverManager = preload(\"./river_manager.gd\")\nconst RiverGizmo = preload(\"./river_gizmo.gd\")\nconst GradientInspector = preload(\"./inspector_plugin.gd\")\nconst ProgressWindow = preload(\"./progress_window.tscn\")\nconst RiverControls = preload(\"./gui/river_controls.gd\")\n\nvar river_gizmo = RiverGizmo.new()\nvar gradient_inspector = GradientInspector.new()\n\nvar _river_controls = preload(\"./gui/river_controls.tscn\").instance()\nvar _water_system_controls = preload(\"./gui/water_system_controls.tscn\").instance()\nvar _edited_node = null\nvar _progress_window = null\nvar _editor_selection : EditorSelection = null\nvar _heightmap_renderer = null\nvar _mode := \"select\"\nvar constraint: int = RiverControls.CONSTRAINTS.NONE\nvar local_editing := false\n\n\nfunc _enter_tree() -> void:\n\tadd_custom_type(\"River\", \"Spatial\", preload(\"./river_manager.gd\"), preload(\"./icons/river.svg\"))\n\tadd_custom_type(\"WaterSystem\", \"Spatial\", preload(\"./water_system_manager.gd\"), preload(\"./icons/system.svg\"))\n\tadd_custom_type(\"Buoyant\", \"Spatial\", preload(\"./buoyant_manager.gd\"), preload(\"./icons/buoyant.svg\"))\n\tadd_spatial_gizmo_plugin(river_gizmo)\n\tadd_inspector_plugin(gradient_inspector)\n\triver_gizmo.editor_plugin = self\n\t_river_controls.connect(\"mode\", self, \"_on_mode_change\")\n\t_river_controls.connect(\"options\", self, \"_on_option_change\")\n\t_progress_window = ProgressWindow.instance()\n\t_river_controls.add_child(_progress_window)\n\t_editor_selection = get_editor_interface().get_selection()\n\t_editor_selection.connect(\"selection_changed\", self, \"_on_selection_change\")\n\tconnect(\"scene_changed\", self, \"_on_scene_changed\");\n\tconnect(\"scene_closed\", self, \"_on_scene_closed\");\n\n\nfunc _on_generate_flowmap_pressed() -> void:\n\t_edited_node.bake_texture()\n\n\nfunc _on_generate_mesh_pressed() -> void:\n\t_edited_node.spawn_mesh()\n\n\nfunc _on_debug_view_changed(index : int) -> void:\n\t_edited_node.set_debug_view(index)\n\n\nfunc _on_generate_system_maps_pressed() -> void:\n\t_edited_node.generate_system_maps()\n\n\nfunc _exit_tree() -> void:\n\tremove_custom_type(\"River\")\n\tremove_custom_type(\"Water System\")\n\tremove_custom_type(\"Buoyant\")\n\tremove_spatial_gizmo_plugin(river_gizmo)\n\tremove_inspector_plugin(gradient_inspector)\n\t_river_controls.disconnect(\"mode\", self, \"_on_mode_change\")\n\t_river_controls.disconnect(\"options\", self, \"_on_option_change\")\n\t_editor_selection.disconnect(\"selection_changed\", self, \"_on_selection_change\")\n\tdisconnect(\"scene_changed\", self, \"_on_scene_changed\");\n\tdisconnect(\"scene_closed\", self, \"_on_scene_closed\");\n\t_hide_river_control_panel()\n\t_hide_water_system_control_panel()\n\n\nfunc handles(node):\n\treturn node is RiverManager or node is WaterSystem\n\n\nfunc edit(node):\n\tif node is RiverManager:\n\t\t_show_river_control_panel()\n\t\t_edited_node = node as RiverManager\n\tif node is WaterSystem:\n\t\t_show_water_system_control_panel()\n\t\t_edited_node = node as WaterSystem\n\n\nfunc _on_selection_change() -> void:\n\t_editor_selection = get_editor_interface().get_selection()\n\tvar selected = _editor_selection.get_selected_nodes()\n\tif len(selected) == 0:\n\t\treturn\n\tif selected[0] is RiverManager:\n\t\t_river_controls.menu.debug_view_menu_selected = _edited_node.debug_view\n\t\tif not _edited_node.is_connected(\"progress_notified\", self, \"_river_progress_notified\"):\n\t\t\t_edited_node.connect(\"progress_notified\", self, \"_river_progress_notified\")\n\t\t_hide_water_system_control_panel()\n\telif selected[0] is WaterSystem:\n\t\t# TODO - is there anything we need to add here?\n\t\t_hide_river_control_panel()\n\telse:\n\t\t_edited_node = null\n\t\t_hide_river_control_panel()\n\t\t_hide_water_system_control_panel()\n\n\nfunc _on_scene_changed(scene_root : Node) -> void:\n\t_hide_river_control_panel()\n\t_hide_water_system_control_panel()\n\n\nfunc _on_scene_closed(_value) -> void:\n\t_hide_river_control_panel()\n\t_hide_water_system_control_panel()\n\n\nfunc _on_mode_change(mode) -> void:\n\t_mode = mode\n\n\nfunc _on_option_change(option, value) -> void:\n\tif option == \"constraint\":\n\t\tconstraint = value\n\t\tif constraint == RiverControls.CONSTRAINTS.COLLIDERS:\n\t\t\tWaterHelperMethods.reset_all_colliders(_edited_node.get_tree().root)\n\telif option == \"local_mode\":\n\t\tlocal_editing = value\n\n\nfunc forward_spatial_gui_input(camera: Camera, event: InputEvent) -> bool:\n\tif not _edited_node:\n\t\treturn false\n\t\n\tvar global_transform: Transform = _edited_node.transform\n\tif _edited_node.is_inside_tree():\n\t\tglobal_transform = _edited_node.get_global_transform()\n\tvar global_inverse: Transform = global_transform.affine_inverse()\n\t\n\tif (event is InputEventMouseButton) and (event.button_index == BUTTON_LEFT):\n\t\t\n\t\tvar ray_from = camera.project_ray_origin(event.position)\n\t\tvar ray_dir = camera.project_ray_normal(event.position)\n\t\tvar g1 = global_inverse.xform(ray_from)\n\t\tvar g2 = global_inverse.xform(ray_from + ray_dir * 4096)\n\t\t\n\t\t# Iterate through points to find closest segment\n\t\tvar curve_points = _edited_node.get_curve_points()\n\t\tvar closest_distance = 4096.0\n\t\tvar closest_segment = -1\n\t\t\n\t\tfor point in curve_points.size() -1:\n\t\t\tvar p1 = curve_points[point]\n\t\t\tvar p2 = curve_points[point + 1]\n\t\t\tvar result  = Geometry.get_closest_points_between_segments(p1, p2, g1, g2)\n\t\t\tvar dist = result[0].distance_to(result[1])\n\t\t\tif dist < closest_distance:\n\t\t\t\tclosest_distance = dist\n\t\t\t\tclosest_segment = point\n\t\t\n\t\t# Iterate through baked points to find the closest position on the\n\t\t# curved path\n\t\tvar baked_curve_points = _edited_node.curve.get_baked_points()\n\t\tvar baked_closest_distance = 4096.0\n\t\tvar baked_closest_point = Vector3()\n\t\tvar baked_point_found = false\n\t\t\n\t\tfor baked_point in baked_curve_points.size() - 1:\n\t\t\tvar p1 = baked_curve_points[baked_point]\n\t\t\tvar p2 = baked_curve_points[baked_point + 1]\n\t\t\tvar result  = Geometry.get_closest_points_between_segments(p1, p2, g1, g2)\n\t\t\tvar dist = result[0].distance_to(result[1])\n\t\t\tif dist < 0.1 and dist < baked_closest_distance:\n\t\t\t\tbaked_closest_distance = dist\n\t\t\t\tbaked_closest_point = result[0]\n\t\t\t\tbaked_point_found = true\n\t\t\n\t\t# In case we were close enough to a line segment to find a segment,\n\t\t# but not close enough to the curved line\n\t\tif not baked_point_found:\n\t\t\tclosest_segment = -1\n\t\t\n\t\t# We'll use this closest point to add a point in between if on the line\n\t\t# and to remove if close to a point\n\t\tif _mode == \"select\":\n\t\t\tif not event.pressed:\n\t\t\t\triver_gizmo.reset()\n\t\t\treturn false\n\t\tif _mode == \"add\" and not event.pressed:\n\t\t\t# if we don't have a point on the line, we'll calculate a point\n\t\t\t# based of a plane of the last point of the curve\n\t\t\tif closest_segment == -1:\n\t\t\t\tvar end_pos = _edited_node.curve.get_point_position(_edited_node.curve.get_point_count() - 1)\n\t\t\t\tvar end_pos_global : Vector3 = _edited_node.to_global(end_pos)\n\t\t\t\t\t\n\t\t\t\tvar z : Vector3 = _edited_node.curve.get_point_out(_edited_node.curve.get_point_count() - 1).normalized()\n\t\t\t\tvar x := z.cross(Vector3.DOWN).normalized()\n\t\t\t\tvar y := z.cross(x).normalized()\n\t\t\t\tvar _handle_base_transform = Transform(\n\t\t\t\t\tBasis(x, y, z) * global_transform.basis,\n\t\t\t\t\tend_pos_global\n\t\t\t\t)\n\t\t\t\n\t\t\t\tvar plane := Plane(end_pos_global, end_pos_global + camera.transform.basis.x, end_pos_global + camera.transform.basis.y)\n\t\t\t\tvar new_pos\n\t\t\t\tif constraint == RiverControls.CONSTRAINTS.COLLIDERS:\n\t\t\t\t\tvar space_state = _edited_node.get_world().direct_space_state\n\t\t\t\t\tvar result = space_state.intersect_ray(ray_from, ray_from + ray_dir * 4096)\n\t\t\t\t\tif result:\n\t\t\t\t\t\tnew_pos = result.position\n\t\t\t\t\telse:\n\t\t\t\t\t\treturn false\n\t\t\t\telif constraint == RiverControls.CONSTRAINTS.NONE:\n\t\t\t\t\tnew_pos = plane.intersects_ray(ray_from, ray_from + ray_dir * 4096)\n\t\t\t\t\n\t\t\t\telif constraint in RiverGizmo.AXIS_MAPPING:\n\t\t\t\t\tvar axis: Vector3 = RiverGizmo.AXIS_MAPPING[constraint]\n\t\t\t\t\tif local_editing:\n\t\t\t\t\t\taxis = _handle_base_transform.basis.xform(axis)\n\t\t\t\t\tvar axis_from = end_pos_global + (axis * RiverGizmo.AXIS_CONSTRAINT_LENGTH)\n\t\t\t\t\tvar axis_to = end_pos_global - (axis * RiverGizmo.AXIS_CONSTRAINT_LENGTH)\n\t\t\t\t\tvar ray_to = ray_from + (ray_dir * RiverGizmo.AXIS_CONSTRAINT_LENGTH)\n\t\t\t\t\tvar result = Geometry.get_closest_points_between_segments(axis_from, axis_to, ray_from, ray_to)\n\t\t\t\t\tnew_pos = result[0]\n\t\t\t\t\n\t\t\t\telif constraint in RiverGizmo.PLANE_MAPPING:\n\t\t\t\t\tvar normal: Vector3 = RiverGizmo.PLANE_MAPPING[constraint]\n\t\t\t\t\tif local_editing:\n\t\t\t\t\t\tnormal = _handle_base_transform.basis.xform(normal)\n\t\t\t\t\tvar projected := end_pos_global.project(normal)\n\t\t\t\t\tvar direction := sign(projected.dot(normal))\n\t\t\t\t\tvar distance := direction * projected.length()\n\t\t\t\t\tplane = Plane(normal, distance)\n\t\t\t\t\tnew_pos = plane.intersects_ray(ray_from, ray_dir)\n\t\t\t\t\t\t\n\t\t\t\tbaked_closest_point = _edited_node.to_local(new_pos)\n\t\t\t\n\t\t\tvar ur := get_undo_redo()\n\t\t\tur.create_action(\"Add River point\")\n\t\t\tur.add_do_method(_edited_node, \"add_point\", baked_closest_point, closest_segment)\n\t\t\tur.add_do_method(_edited_node, \"properties_changed\")\n\t\t\tur.add_do_method(_edited_node, \"set_materials\", \"i_valid_flowmap\", false)\n\t\t\tur.add_do_property(_edited_node, \"valid_flowmap\", false)\n\t\t\tur.add_do_method(_edited_node, \"update_configuration_warning\")\n\t\t\tif closest_segment == -1:\n\t\t\t\tur.add_undo_method(_edited_node, \"remove_point\", _edited_node.curve.get_point_count()) # remove last\n\t\t\telse:\n\t\t\t\tur.add_undo_method(_edited_node, \"remove_point\", closest_segment + 1)\n\t\t\tur.add_undo_method(_edited_node, \"properties_changed\")\n\t\t\tur.add_undo_method(_edited_node, \"set_materials\", \"i_valid_flowmap\", _edited_node.valid_flowmap)\n\t\t\tur.add_undo_property(_edited_node, \"valid_flowmap\", _edited_node.valid_flowmap)\n\t\t\tur.add_undo_method(_edited_node, \"update_configuration_warning\")\n\t\t\tur.commit_action()\n\t\tif _mode == \"remove\" and not event.pressed:\n\t\t\t# A closest_segment of -1 means we didn't press close enough to a\n\t\t\t# point for it to be removed\n\t\t\tif not closest_segment == -1: \n\t\t\t\tvar closest_index = _edited_node.get_closest_point_to(baked_closest_point)\n\t\t\t\t#_edited_node.remove_point(closest_index)\n\t\t\t\tvar ur = get_undo_redo()\n\t\t\t\tur.create_action(\"Remove River point\")\n\t\t\t\tur.add_do_method(_edited_node, \"remove_point\", closest_index)\n\t\t\t\tur.add_do_method(_edited_node, \"properties_changed\")\n\t\t\t\tur.add_do_method(_edited_node, \"set_materials\", \"i_valid_flowmap\", false)\n\t\t\t\tur.add_do_property(_edited_node, \"valid_flowmap\", false)\n\t\t\t\tur.add_do_method(_edited_node, \"update_configuration_warning\")\n\t\t\t\tif closest_index == _edited_node.curve.get_point_count() - 1:\n\t\t\t\t\tur.add_undo_method(_edited_node, \"add_point\", _edited_node.curve.get_point_position(closest_index), -1)\n\t\t\t\telse:\n\t\t\t\t\tur.add_undo_method(_edited_node, \"add_point\", _edited_node.curve.get_point_position(closest_index), closest_index - 1, _edited_node.curve.get_point_out(closest_index), _edited_node.widths[closest_index])\n\t\t\t\tur.add_undo_method(_edited_node, \"properties_changed\")\n\t\t\t\tur.add_undo_method(_edited_node, \"set_materials\", \"i_valid_flowmap\", _edited_node.valid_flowmap)\n\t\t\t\tur.add_undo_property(_edited_node, \"valid_flowmap\", _edited_node.valid_flowmap)\n\t\t\t\tur.add_undo_method(_edited_node, \"update_configuration_warning\")\n\t\t\t\tur.commit_action()\n\t\treturn true\n\t\n\telif _edited_node is RiverManager:\n\t\t# Forward input to river controls. This is cleaner than handling\n\t\t# the keybindings here as the keybindings need to interact with\n\t\t# the buttons. Handling it here would expose more private details\n\t\t# of the controls than needed, instead only the spatial_gui_input()\n\t\t# method needs to be exposed.\n\t\treturn _river_controls.spatial_gui_input(event)\n\t\n\treturn false\n\n\nfunc _river_progress_notified(progress : float, message : String) -> void:\n\tif message == \"finished\":\n\t\t_progress_window.hide()\n\t\n\telse:\n\t\tif not _progress_window.visible:\n\t\t\t_progress_window.popup_centered()\n\t\t\n\t\t_progress_window.show_progress(message, progress)\n\n\nfunc _show_river_control_panel() -> void:\n\tif not _river_controls.get_parent():\n\t\tadd_control_to_container(CONTAINER_SPATIAL_EDITOR_MENU, _river_controls)\n\t\t_river_controls.menu.connect(\"generate_flowmap\", self, \"_on_generate_flowmap_pressed\")\n\t\t_river_controls.menu.connect(\"generate_mesh\", self, \"_on_generate_mesh_pressed\")\n\t\t_river_controls.menu.connect(\"debug_view_changed\", self, \"_on_debug_view_changed\")\n\n\nfunc _hide_river_control_panel() -> void:\n\tif _river_controls.get_parent():\n\t\tremove_control_from_container(CONTAINER_SPATIAL_EDITOR_MENU, _river_controls)\n\t\t_river_controls.menu.disconnect(\"generate_flowmap\", self, \"_on_generate_flowmap_pressed\")\n\t\t_river_controls.menu.disconnect(\"generate_mesh\", self, \"_on_generate_mesh_pressed\")\n\t\t_river_controls.menu.disconnect(\"debug_view_changed\", self, \"_on_debug_view_changed\")\n\n\nfunc _show_water_system_control_panel() -> void:\n\tif not _water_system_controls.get_parent():\n\t\tadd_control_to_container(CONTAINER_SPATIAL_EDITOR_MENU, _water_system_controls)\n\t\t_water_system_controls.menu.connect(\"generate_system_maps\", self, \"_on_generate_system_maps_pressed\")\n\n\nfunc _hide_water_system_control_panel() -> void:\n\tif _water_system_controls.get_parent():\n\t\tremove_control_from_container(CONTAINER_SPATIAL_EDITOR_MENU, _water_system_controls)\n\t\t_water_system_controls.menu.disconnect(\"generate_system_maps\", self, \"_on_generate_system_maps_pressed\")\n", "flow/Waterways/addons/waterways/progress_window.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\ntool\nextends Control\n\n\nonready var _progress_bar = $VBoxContainer/ProgressBar\n\n\nfunc show_progress(message, progress) -> void:\n\tself.window_title = message\n\t_progress_bar.ratio = progress\n", "flow/Waterways/addons/waterways/river_gizmo.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\nextends EditorSpatialGizmoPlugin\n\n\nconst RiverManager = preload(\"./river_manager.gd\")\nconst RiverControls = preload(\"./gui/river_controls.gd\")\nconst HANDLES_PER_POINT = 5\nconst AXIS_CONSTRAINT_LENGTH = 4096\nconst AXIS_MAPPING := {\n\tRiverControls.CONSTRAINTS.AXIS_X: Vector3.RIGHT,\n\tRiverControls.CONSTRAINTS.AXIS_Y: Vector3.UP,\n\tRiverControls.CONSTRAINTS.AXIS_Z: Vector3.BACK\n}\nconst PLANE_MAPPING := {\n\tRiverControls.CONSTRAINTS.PLANE_YZ: Vector3.RIGHT,\n\tRiverControls.CONSTRAINTS.PLANE_XZ: Vector3.UP,\n\tRiverControls.CONSTRAINTS.PLANE_XY: Vector3.BACK\n}\n\nvar editor_plugin : EditorPlugin\n\nvar _path_mat\nvar _handle_lines_mat\nvar _handle_base_transform\n\n\n# Ensure that the width handle can't end up inside the center handle\n# as then it is hard to separate them again.\nconst MIN_DIST_TO_CENTER_HANDLE = 0.02\n\nfunc _init() -> void:\n\t# Two materials for every handle type.\n\t# 1) Transparent handle that is always shown.\n\t# 2) Opaque handle that is only shown above terrain (when passing depth test)\n\t# Note that this impacts the point index of the handles. See table below.\n\tcreate_handle_material(\"handles_center\")\n\tcreate_handle_material(\"handles_control_points\")\n\tcreate_handle_material(\"handles_width\")\n\tcreate_handle_material(\"handles_center_with_depth\")\n\tcreate_handle_material(\"handles_control_points_with_depth\")\n\tcreate_handle_material(\"handles_width_with_depth\")\n\n\tvar handles_center_mat             = get_material(\"handles_center\")\n\tvar handles_center_mat_wd          = get_material(\"handles_center_with_depth\")\n\tvar handles_control_points_mat     = get_material(\"handles_control_points\")\n\tvar handles_control_points_mat_wd  = get_material(\"handles_control_points_with_depth\")\n\tvar handles_width_mat              = get_material(\"handles_width\")\n\tvar handles_width_mat_wd           = get_material(\"handles_width_with_depth\")\n\n\thandles_center_mat.set_albedo(           Color(1.0, 1.0, 0.0, 0.25))\n\thandles_center_mat_wd.set_albedo(        Color(1.0, 1.0, 0.0, 1.0))\n\thandles_control_points_mat.set_albedo(   Color(1.0, 0.5, 0.0, 0.25))\n\thandles_control_points_mat_wd.set_albedo(Color(1.0, 0.5, 0.0, 1.0))\n\thandles_width_mat.set_albedo(            Color(0.0, 1.0, 1.0, 0.25))\n\thandles_width_mat_wd.set_albedo(         Color(0.0, 1.0, 1.0, 1.0))\n\n\thandles_center_mat.set_flag(           SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, true)\n\thandles_center_mat_wd.set_flag(        SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, false)\n\thandles_control_points_mat.set_flag(   SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, true)\n\thandles_control_points_mat_wd.set_flag(SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, false)\n\thandles_width_mat.set_flag(            SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, true)\n\thandles_width_mat_wd.set_flag(         SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, false)\n\n\tvar mat = SpatialMaterial.new()\n\tmat.set_flag(SpatialMaterial.FLAG_UNSHADED, true)\n\tmat.set_flag(SpatialMaterial.FLAG_DISABLE_DEPTH_TEST, true)\n\tmat.set_albedo(Color(1.0, 1.0, 0.0))\n\tmat.render_priority = 10\n\tadd_material(\"path\", mat)\n\tadd_material(\"handle_lines\", mat)\n\n\nfunc reset() -> void:\n\t_handle_base_transform = null\n\n\nfunc get_name() -> String:\n\treturn \"RiverInput\"\n\n\nfunc has_gizmo(spatial) -> bool:\n\treturn spatial is RiverManager\n\n\nfunc get_handle_name(gizmo: EditorSpatialGizmo, index: int) -> String:\n\treturn \"Handle \" + String(index)\n\n# Handles are pushed to separate handle lists, one per material (using gizmo.add_handles).\n# A handle's \"index\" is given (by Godot) in order it was added to a gizmo. \n# Given that N = points in the curve:\n# - First we add the center (\"actual\") curve handles, therefore\n#   the handle's index is the same as the curve point's index.\n# - Then we add the in and out points together. So the first curve point's IN handle\n#   gets an index of N. The OUT handle gets N+1.\n# - Finally the left/right indices come last, and the first curve point's LEFT is N * 3 .\n#   (3 because there are three rows before the left/right indices)\n#\n# Examples for N = 2, 3, 4:\n# curve points 2:0   1      3:0   1   2        4:0   1   2   3\n# ------------------------------------------------------------------\n# center         0   1        0   1   2          0   1   2   3\n# in             2   4        3   5   7          4   6   8   10\n# out            3   5        4   6   8          5   7   9   11\n# left           6   8        9   11  13         12  14  16  18\n# right          7   9        10  12  14         13  15  17  19\n#\n# The following utility functions calculate to and from curve/handle indices.\n\nfunc _is_center_point(index: int, river_curve_point_count: int):\n\tvar res = index < river_curve_point_count\n\treturn res\n\nfunc _is_control_point_in(index: int, river_curve_point_count: int):\n\tif index < river_curve_point_count:\n\t\treturn false\n\tif index >= river_curve_point_count * 3:\n\t\treturn false\n\tvar res = (index - river_curve_point_count) % 2 == 0\n\treturn res\n\nfunc _is_control_point_out(index: int, river_curve_point_count: int):\n\tif index < river_curve_point_count:\n\t\treturn false\n\tif index >= river_curve_point_count * 3:\n\t\treturn false\n\tvar res = (index - river_curve_point_count) % 2 == 1\n\treturn res\n\nfunc _is_width_point_left(index: int, river_curve_point_count: int):\n\tif index < river_curve_point_count * 3:\n\t\treturn false\n\tvar res = (index - river_curve_point_count * 3) % 2 == 0\n\treturn res\n\nfunc _is_width_point_right(index: int, river_curve_point_count: int):\n\tif index < river_curve_point_count * 3:\n\t\treturn false\n\tvar res = (index - river_curve_point_count * 3) % 2 == 1\n\treturn res\n\nfunc _get_curve_index(index: int, point_count: int):\n\tif _is_center_point(index, point_count):\n\t\treturn index\n\tif _is_control_point_in(index, point_count):\n\t\treturn (index - point_count) / 2\n\tif _is_control_point_out(index, point_count):\n\t\treturn (index - point_count - 1) / 2\n\tif _is_width_point_left(index, point_count) or _is_width_point_right(index, point_count):\n\t\treturn (index - point_count * 3) / 2\n\nfunc _get_point_index(curve_index: int, is_center: bool, is_cp_in: bool, is_cp_out: bool, is_width_left: bool, is_width_right: bool, point_count: int):\n\tif is_center:\n\t\treturn curve_index\n\tif is_cp_in:\n\t\treturn point_count + curve_index * 2\n\tif is_cp_out:\n\t\treturn point_count + 1 + curve_index * 2\n\tif is_width_left:\n\t\treturn point_count * 3 + curve_index * 2\n\tif is_width_right:\n\t\treturn point_count * 3 + 1 + curve_index * 2\n\n\nfunc get_handle_value(gizmo: EditorSpatialGizmo, index: int):\n\tvar river : RiverManager = gizmo.get_spatial_node()\n\tvar point_count = river.curve.get_point_count()\n\tif _is_center_point(index, point_count):\n\t\treturn river.curve.get_point_position(_get_curve_index(index, point_count))\n\tif _is_control_point_in(index, point_count):\n\t\treturn river.curve.get_point_in(_get_curve_index(index, point_count))\n\tif _is_control_point_out(index, point_count):\n\t\treturn river.curve.get_point_out(_get_curve_index(index, point_count))\n\tif _is_width_point_left(index, point_count) or _is_width_point_right(index, point_count):\n\t\treturn river.widths[_get_curve_index(index, point_count)]\n\n\n# Called when handle is moved\nfunc set_handle(gizmo: EditorSpatialGizmo, index: int, camera: Camera, point: Vector2) -> void:\n\tvar river : RiverManager = gizmo.get_spatial_node()\n\tvar space_state := river.get_world().direct_space_state\n\n\tvar global_transform : Transform = river.transform\n\tif river.is_inside_tree():\n\t\tglobal_transform = river.get_global_transform()\n\tvar global_inverse: Transform = global_transform.affine_inverse()\n\n\tvar ray_from = camera.project_ray_origin(point)\n\tvar ray_dir = camera.project_ray_normal(point)\n\n\tvar old_pos : Vector3\n\tvar point_count = river.curve.get_point_count()\n\tvar p_index = _get_curve_index(index, point_count)\n\tvar base = river.curve.get_point_position(p_index)\n\n\t# Logic to move handles\n\tvar is_center = _is_center_point(index, point_count)\n\tvar is_cp_in = _is_control_point_in(index, point_count)\n\tvar is_cp_out = _is_control_point_out(index, point_count)\n\tvar is_width_left = _is_width_point_left(index, point_count)\n\tvar is_width_right = _is_width_point_right(index, point_count)\n\tif is_center:\n\t\told_pos = base\n\tif is_cp_in:\n\t\told_pos = river.curve.get_point_in(p_index) + base\n\tif is_cp_out:\n\t\told_pos = river.curve.get_point_out(p_index) + base\n\tif is_width_left:\n\t\told_pos = base + river.curve.get_point_out(p_index).cross(Vector3.UP).normalized() * river.widths[p_index]\n\tif is_width_right:\n\t\told_pos = base + river.curve.get_point_out(p_index).cross(Vector3.DOWN).normalized() * river.widths[p_index]\n\t\n\tvar old_pos_global := river.to_global(old_pos)\n\t\n\tif not _handle_base_transform:\n\t\t# This is the first set_handle() call since the last reset so we\n\t\t# use the current handle position as our _handle_base_transform\n\t\tvar z := river.curve.get_point_out(p_index).normalized()\n\t\tvar x := z.cross(Vector3.DOWN).normalized()\n\t\tvar y := z.cross(x).normalized()\n\t\t_handle_base_transform = Transform(\n\t\t\tBasis(x, y, z) * global_transform.basis,\n\t\t\told_pos_global\n\t\t)\n\t\n\t# Point, in and out handles\n\tif is_center or is_cp_in or is_cp_out:\n\t\tvar new_pos\n\t\t\n\t\tif editor_plugin.constraint == RiverControls.CONSTRAINTS.COLLIDERS:\n\t\t\t# TODO - make in / out handles snap to a plane based on the normal of\n\t\t\t# the raycast hit instead.\n\t\t\tvar result = space_state.intersect_ray(ray_from, ray_from + ray_dir * 4096)\n\t\t\tif result:\n\t\t\t\tnew_pos = result.position\n\t\t\n\t\telif editor_plugin.constraint == RiverControls.CONSTRAINTS.NONE:\n\t\t\tvar plane = Plane(old_pos_global, old_pos_global + camera.transform.basis.x, old_pos_global + camera.transform.basis.y)\n\t\t\tnew_pos = plane.intersects_ray(ray_from, ray_dir)\n\t\t\n\t\telif editor_plugin.constraint in AXIS_MAPPING:\n\t\t\tvar axis: Vector3 = AXIS_MAPPING[editor_plugin.constraint]\n\t\t\tif editor_plugin.local_editing:\n\t\t\t\taxis = _handle_base_transform.basis.xform(axis)\n\t\t\tvar axis_from = old_pos_global + (axis * AXIS_CONSTRAINT_LENGTH)\n\t\t\tvar axis_to = old_pos_global - (axis * AXIS_CONSTRAINT_LENGTH)\n\t\t\tvar ray_to = ray_from + (ray_dir * AXIS_CONSTRAINT_LENGTH)\n\t\t\tvar result = Geometry.get_closest_points_between_segments(axis_from, axis_to, ray_from, ray_to)\n\t\t\tnew_pos = result[0]\n\t\t\n\t\telif editor_plugin.constraint in PLANE_MAPPING:\n\t\t\tvar normal: Vector3 = PLANE_MAPPING[editor_plugin.constraint]\n\t\t\tif editor_plugin.local_editing:\n\t\t\t\tnormal = _handle_base_transform.basis.xform(normal)\n\t\t\tvar projected := old_pos_global.project(normal)\n\t\t\tvar direction := sign(projected.dot(normal))\n\t\t\tvar distance := direction * projected.length()\n\t\t\tvar plane := Plane(normal, distance)\n\t\t\tnew_pos = plane.intersects_ray(ray_from, ray_dir)\n\t\t\n\t\t# Discard if no valid position was found\n\t\tif not new_pos:\n\t\t\treturn\n\t\t\n\t\t# TODO: implement rounding when control is pressed.\n\t\t# How do we round when in local axis/plane mode?\n\t\t\n\t\tvar new_pos_local := river.to_local(new_pos)\n\n\n\t\tif is_center:\n\t\t\triver.set_curve_point_position(p_index, new_pos_local)\n\t\tif is_cp_in:\n\t\t\triver.set_curve_point_in(p_index, new_pos_local - base)\n\t\t\triver.set_curve_point_out(p_index, -(new_pos_local - base))\n\t\tif is_cp_out:\n\t\t\triver.set_curve_point_out(p_index, new_pos_local - base)\n\t\t\triver.set_curve_point_in(p_index, -(new_pos_local - base))\n\t\n\t# Widths handles\n\tif is_width_left or is_width_right:\n\t\tvar p1 = base\n\t\tvar p2\n\t\tif is_width_left:\n\t\t\tp2 = river.curve.get_point_out(p_index).cross(Vector3.UP).normalized() * 4096\n\t\tif is_width_right:\n\t\t\tp2 = river.curve.get_point_out(p_index).cross(Vector3.DOWN).normalized() * 4096\n\t\tvar g1 = global_inverse.xform(ray_from)\n\t\tvar g2 = global_inverse.xform(ray_from + ray_dir * 4096)\n\t\t\n\t\tvar geo_points = Geometry.get_closest_points_between_segments(p1, p2, g1, g2)\n\t\tvar dir = geo_points[0].distance_to(base) - old_pos.distance_to(base)\n\t\t\n\t\triver.widths[p_index] += dir\n\t\n\n\t\t# Ensure width handles don't end up inside the center point\n\t\triver.widths[p_index] = max(river.widths[p_index], MIN_DIST_TO_CENTER_HANDLE)\n\tredraw(gizmo)\n\n# Handle Undo / Redo of handle movements\nfunc commit_handle(gizmo: EditorSpatialGizmo, index: int, restore, cancel: bool = false) -> void:\n\tvar river : RiverManager = gizmo.get_spatial_node()\n\tvar point_count = river.curve.get_point_count()\n\n\tvar ur = editor_plugin.get_undo_redo()\n\tur.create_action(\"Change River Shape\")\n\n\tvar p_index = _get_curve_index(index, point_count)\n\tif _is_center_point(index, point_count):\n\t\tur.add_do_method(river, \"set_curve_point_position\", p_index, river.curve.get_point_position(p_index))\n\t\tur.add_undo_method(river, \"set_curve_point_position\", p_index, restore)\n\tif _is_control_point_in(index, point_count):\n\t\tur.add_do_method(river, \"set_curve_point_in\", p_index, river.curve.get_point_in(p_index))\n\t\tur.add_undo_method(river, \"set_curve_point_in\", p_index, restore)\n\t\tur.add_do_method(river, \"set_curve_point_out\", p_index, river.curve.get_point_out(p_index))\n\t\tur.add_undo_method(river, \"set_curve_point_out\", p_index, -restore)\n\tif _is_control_point_out(index, point_count):\n\t\tur.add_do_method(river, \"set_curve_point_out\", p_index, river.curve.get_point_out(p_index))\n\t\tur.add_undo_method(river, \"set_curve_point_out\", p_index, restore)\n\t\tur.add_do_method(river, \"set_curve_point_in\", p_index, river.curve.get_point_in(p_index))\n\t\tur.add_undo_method(river, \"set_curve_point_in\", p_index, -restore)\n\tif _is_width_point_left(index, point_count) or _is_width_point_right(index, point_count):\n\t\tvar river_widths_undo := river.widths.duplicate(true)\n\t\triver_widths_undo[p_index] = restore\n\t\tur.add_do_property(river, \"widths\", river.widths)\n\t\tur.add_undo_property(river, \"widths\", river_widths_undo)\n\t\n\tur.add_do_method(river, \"properties_changed\")\n\tur.add_do_method(river, \"set_materials\", \"i_valid_flowmap\", false)\n\tur.add_do_property(river, \"valid_flowmap\", false)\n\tur.add_do_method(river, \"update_configuration_warning\")\n\tur.add_undo_method(river, \"properties_changed\")\n\tur.add_undo_method(river, \"set_materials\", \"i_valid_flowmap\", river.valid_flowmap)\n\tur.add_undo_property(river, \"valid_flowmap\", river.valid_flowmap)\n\tur.add_undo_method(river, \"update_configuration_warning\")\n\tur.commit_action()\n\t\n\tredraw(gizmo)\n\nfunc redraw(gizmo: EditorSpatialGizmo) -> void:\n\t# Work around for issue where using \"get_material\" doesn't return a\n\t# material when redraw is being called manually from _set_handle()\n\t# so I'm caching the materials instead\n\tif not _path_mat:\n\t\t_path_mat = get_material(\"path\", gizmo)\n\tif not _handle_lines_mat:\n\t\t_handle_lines_mat = get_material(\"handle_lines\", gizmo)\n\tgizmo.clear()\n\t\n\tvar river := gizmo.get_spatial_node() as RiverManager\n\t\n\tif not river.is_connected(\"river_changed\", self, \"redraw\"):\n\t\triver.connect(\"river_changed\", self, \"redraw\", [gizmo])\n\t\n\t_draw_path(gizmo, river.curve)\n\t_draw_handles(gizmo, river)\n\nfunc _draw_path(gizmo: EditorSpatialGizmo, curve : Curve3D) -> void:\n\tvar path = PoolVector3Array()\n\tvar baked_points = curve.get_baked_points()\n\ pler2D b_texture : hint_black;\nuniform sampler2D a_texture : hint_white;\n\nvoid fragment() {\n\tCOLOR = vec4(texture(r_texture, UV).r, texture(g_texture, UV).g, texture(b_texture, UV).b, texture(a_texture, UV).r);\n}", "flow/Waterways/addons/waterways/shaders/filters/dilate_filter_pass1.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\nuniform float dilation = 0.1;\n\n\nfloat input_in(vec2 uv) {\n\treturn (dot(texture(input_texture, uv).rgb, vec3(1.0))/3.0);\n}\n\nvec3 distance_h(vec2 uv) {\n\tvec2 e = vec2( 1.0 / size, 0.0);\n\tint steps = int( size * dilation );\n\tfloat rv = 0.0;\n\tvec2 source_uv;\n\tfor (int i = 0; i < steps; ++i) {\n\t\tsource_uv = uv + float(i) * e;\n\t\tif (input_in(source_uv) > 0.5) {\n\t\t\trv = 1.0 - float(i) * e.x / dilation;\n\t\t\tbreak;\n\t\t}\n\t\tsource_uv = uv - float(i) * e;\n\t\tif (input_in(source_uv) > 0.5) {\n\t\t\trv = 1.0-float(i)*e.x/dilation;\n\t\t\tbreak;\n\t\t}\n\t}\n\treturn vec3(rv, source_uv);\n}\n\nvoid fragment() {\n\tvec3 dilated_uv = distance_h((UV));\n\tCOLOR = vec4(dilated_uv, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/filters/dilate_filter_pass2.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\nuniform float dilation = 0.1;\n\nvec3 distance_v(vec2 uv) {\n\tvec2 e = vec2(0.0, 1.0/size);\n\tint steps = int(size*dilation);\n\tvec3 p = texture(input_texture, uv).rgb;\n\tfor (int i = 0; i < steps; ++i) {\n\t\tvec2 dx = float(i)*e;\n\t\tvec3 p2 = texture(input_texture, uv+dx).rgb;\n\t\tif (p2.x > p.x) {\n\t\t\tp2.x = 1.0-sqrt((1.0-p2.x)*(1.0-p2.x)+dx.y*dx.y/dilation/dilation);\n\t\t\tp = mix(p, p2, step(p.x, p2.x));\n\t\t}\n\t\tp2 = texture(input_texture, uv-dx).rgb;\n\t\tif (p2.x > p.x) {\n\t\t\tp2.x = 1.0-sqrt((1.0-p2.x)*(1.0-p2.x)+dx.y*dx.y/dilation/dilation);\n\t\t\tp = mix(p, p2, step(p.x, p2.x));\n\t\t}\n\t}\n\treturn p;\n}\n\nvoid fragment() {\n\tvec3 dilated_uv = distance_v((UV));\n\tCOLOR = vec4(dilated_uv, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/filters/dilate_filter_pass3.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D distance_texture;\nuniform sampler2D color_texture : hint_white;\nuniform float fill = 1.0;\n\nvoid fragment() {\n\tvec3 dist = texture(distance_texture, UV).rgb;\n\tCOLOR = vec4(texture(color_texture, dist.yz).rgb * mix(dist.x, 1.0, fill), 1.0);\n\t//COLOR = vec4(dist.xxx, 1.0);\n\t//$source($distance($uv).yz) * mix($distance($uv).x, 1.0, $amount)\n}", "flow/Waterways/addons/waterways/shaders/filters/dotproduct.shader": "shader_type canvas_item;\n\nuniform sampler2D input_texture;\n\nvoid fragment() {\n\tfloat value = dot(texture(input_texture, UV).xy, vec2(0.0, 1.0));\n\t//value = value * 0.5 + 1.0; // pack values\n\tCOLOR = vec4(value, value, value, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/filters/flow_pressure_pass.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\nuniform float rows = 1.0;\n\nvoid fragment() {\n\tfloat value = 0.0;\n\tfloat pixel_size = 1.0 / size;\n\tfor (int i = 0; i < int(size) / int(rows); i++) {\n\t\tfloat base_x = floor(UV.x * rows) / rows;\n\t\tvec2 new_uv = vec2(base_x + float(i) / size, UV.y) + pixel_size / 2.0;\n\t\tvalue += textureLod(input_texture, new_uv, 0.0).r;\n\t}\nvalue /= size / rows;\nCOLOR = vec4(vec3(value), 1.0);\n}", "flow/Waterways/addons/waterways/shaders/filters/foam_pass.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\nuniform float offset = 0.1;\nuniform float cutoff = 0.9;\n\n\nfloat invLerp(float from, float to, float value){\n\treturn (value - from) / (to - from);\n}\n\nfloat remap(float origFrom, float origTo, float targetFrom, float targetTo, float value){\n\tfloat rel = invLerp(origFrom, origTo, value);\n\treturn mix(targetFrom, targetTo, rel);\n}\n\nvoid fragment() {\n\tfloat combine;\n\tfor(int i; i < 10; i++) {\n\t\tvec4 lodded_texture = textureLod(input_texture, UV - vec2(0.0, float(i) * (offset / 10.0)), 0.0);\n\t\tfloat remapped = remap(cutoff, 1.0, 0.0, 1.0, lodded_texture.r);\n\t\tcombine = max(combine, remapped);\n\t}\n\tCOLOR = vec4(combine, combine, combine, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/filters/normal_map_pass.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\n\nfloat input_in(vec2 uv) {\n\tvec4 lodded_texture = textureLod(input_texture, uv, 0.0);\nreturn (dot((lodded_texture).rgb, vec3(1.0))/3.0);\n}\n\nvec3 fct(vec2 uv) {\n\tvec3 e = vec3(1.0 / size, -1.0 / size, 0);\n\tvec2 rv = vec2(1.0, -1.0) * input_in(uv + e.xy);\n\trv += vec2(-1.0, 1.0) * input_in(uv - e.xy);\n\trv += vec2(1.0, 1.0) * input_in(uv + e.xx);\n\trv += vec2(-1.0, -1.0) * input_in(uv - e.xx);\n\trv += vec2(2.0, 0.0) * input_in(uv + e.xz);\n\trv += vec2(-2.0, 0.0) * input_in(uv - e.xz);\n\trv += vec2(0.0, 2.0) * input_in(uv + e.zx);\n\trv += vec2(0.0, -2.0) * input_in(uv - e.zx);\n\treturn vec3(rv, 0.0);\n}\n\nvec3 process_normal(vec3 v, float multiplier) {\n\treturn 0.5 * normalize(v.xyz * multiplier + vec3(0.0, 0.0, -1.0)) + vec3(0.5);\n}\n\nvoid fragment() {\n\tvec3 normal_map = process_normal(fct((UV)), size / 128.0);\n\tCOLOR = vec4(normal_map, 1.0);\n}\n", "flow/Waterways/addons/waterways/shaders/filters/normal_to_flow_filter.shader": "shader_type canvas_item;\n\nuniform float size = 512.0;\nuniform sampler2D input_texture;\n\nvec3 nm2flow(vec2 x) {\n    x -= vec2(0.5);\n    vec3 rv = vec3(sign(x.x)*vec2(-x.y, x.x), -1.0);\n    return normalize(rv);\n}\n\nvoid fragment() {\n    vec4 texture_sample = textureLod(input_texture, UV, 0.0);\n    vec3 flowmap = nm2flow(texture_sample.xy) * 0.5 + 0.5;\n    COLOR = vec4(flowmap, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/gui/gradient.shader": "shader_type canvas_item;\n\nuniform vec4 color1 = vec4(0.25, 0.25, 0.70, 1.0);\nuniform vec4 color2 = vec4(0.25, 0.50, 0.70, 1.0);\n\nvoid fragment() {\n\tvec4 mixed_color = mix(color1, color2, UV.x);\n\tCOLOR = mixed_color;\n}", "flow/Waterways/addons/waterways/shaders/lava.shader": "// Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n// See `LICENSE.md` included in the source distribution for details.\nshader_type spatial;\nrender_mode depth_draw_always, cull_disabled;\n\n// If you are making your own shader, you can customize or add your own\n// parameters below and they will automatically get parsed and displayed in\n// the River inspector.\n\n// Use prefixes: albedo_, emission_, transparency_, flow_, foam_ and custom_\n// to automatically put your parameters into categories in the inspector.\n\n// If \"curve\" is in the name, the inspector will represent and easing curve\n// mat4s will get parsed as gradients, see documentation for details\n\n// main\nuniform float normal_scale : hint_range(-16.0, 16.0) = 1.0;\nuniform sampler2D normal_bump_texture : hint_normal;\nuniform vec3 uv_scale = vec3(1.0, 1.0, 1.0);\nuniform float roughness : hint_range(0.0, 1.0) = 0.7;\nuniform float edge_fade : hint_range(0.0, 1.0) = 0.25;\n\n// emission\nuniform mat4 emission_color = mat4(vec4(1.0, 1.0, 0.0, 0.0), vec4(1.0, 0.5, 0.0, 0.0), vec4(1.0, 0.5, 0.0, 0.0), vec4(0.0));\nuniform float emission_energy : hint_range(0.0, 20.0) = 4.0;\nuniform float emission_depth : hint_range(0.0, 200.0) = 3.0;\nuniform float emission_depth_curve = 0.25;\nuniform sampler2D emission_texture : hint_black_albedo;\n\n// flow\nuniform float flow_speed : hint_range(0.0, 10.0) = 1.0;\nuniform float flow_base : hint_range(0.0, 8.0) = 0.0;\nuniform float flow_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float flow_distance : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_pressure : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_max : hint_range(0.0, 8.0) = 4.0;\n\n// Internal uniforms, do not customize these\nuniform sampler2D i_flowmap : hint_normal;\nuniform sampler2D i_distmap : hint_white;\nuniform bool i_valid_flowmap = false;\nuniform int i_uv2_sides = 2;\n\nvec3 FlowUVW(vec2 uv_in, vec2 flowVector, vec2 jump, vec3 tiling, float time, bool flowB) {\n\tfloat phaseOffset = flowB ? 0.5 : 0.0;\n\tfloat progress = fract(time + phaseOffset);\n\tvec3 uvw;\n\tuvw.xy = uv_in - flowVector * (progress - 0.5);\n\tuvw.xy *= tiling.xy;\n\tuvw.xy += phaseOffset;\n\tuvw.xy += (time - progress) * jump;\n\tuvw.z = 1.0 - abs(1.0 - 2.0 * progress);\n\treturn uvw;\n}\n\n// ease implementation copied from math_funcs.cpp in source\nfloat ease(float p_x, float p_c) {\n\tif (p_x < 0.0) {\n\t\tp_x = 0.0;\n\t} else if (p_x > 1.0) {\n\t\tp_x = 1.0;\n\t}\n\tif (p_c > 0.0) {\n\t\tif (p_c < 1.0) {\n\t\t\treturn 1.0 - pow(1.0 - p_x, 1.0 / p_c);\n\t\t} else {\n\t\t\treturn pow(p_x, p_c);\n\t\t}\n\t} else if (p_c < 0.0) {\n\t\t//inout ease\n\t\t\n\t\tif (p_x < 0.5) {\n\t\t\treturn pow(p_x * 2.0, -p_c) * 0.5;\n\t\t} else {\n\t\t\treturn (1.0 - pow(1.0 - (p_x - 0.5) * 2.0, -p_c)) * 0.5 + 0.5;\n\t\t}\n\t} else {\n\t\treturn 0.0; // no ease (raw)\n\t}\n}\n\nfloat lin2srgb(float lin) {\n\treturn pow(lin, 2.2);\n}\n\nmat4 gradient_lin2srgb(mat4 lin_mat) {\n\tmat4 srgb_mat = mat4(\n\t\tvec4(lin2srgb(lin_mat[0].x), lin2srgb(lin_mat[0].y), lin2srgb(lin_mat[0].z), lin2srgb(lin_mat[0].w)),\n\t\tvec4(lin2srgb(lin_mat[1].x), lin2srgb(lin_mat[1].y), lin2srgb(lin_mat[1].z), lin2srgb(lin_mat[1].w)),\n\t\tvec4(0.0),\n\t\tvec4(0.0)\n\t);\n\treturn srgb_mat;\n}\n\nvoid fragment() {\n\t// Sample the UV2 textures. To avoid issues with the UV2 seams, margins\n\t// are left on the textures, so the UV2 needs to be rescaled to cut off\n\t// the margins.\n\tvec2 custom_UV = (UV2 + 1.0 / float(i_uv2_sides)) * (float(i_uv2_sides) / float(i_uv2_sides + 2));\n\tvec4 flow_foam_noise = textureLod(i_flowmap, custom_UV, 0.0);\n\tvec2 dist_pressure = textureLod(i_distmap, custom_UV, 0.0).xy;\n\t\n\tvec2 flow;\n\tfloat distance_map;\n\tfloat pressure_map;\n\tif (i_valid_flowmap) {\n\t\tflow = flow_foam_noise.xy;\n\t\tdistance_map = (1.0 - dist_pressure.r) * 2.0;\n\t\tpressure_map = dist_pressure.g * 2.0;\n\t} else {\n\t\tflow = vec2(0.5, 0.572);\n\t\tdistance_map = 0.5;\n\t\tpressure_map = 0.5;\n\t}\n\t\n\tflow = (flow - 0.5) * 2.0; // unpack the flow vectors\n\t\n\t// Calculate the steepness map\n\tvec3 flow_viewspace = flow.x * TANGENT + flow.y * BINORMAL;\n\tvec3 up_viewspace = (INV_CAMERA_MATRIX * vec4(0.0, 1.0, 0.0, 0.0)).xyz;\n\tfloat steepness_map = max(0.0, dot(flow_viewspace, up_viewspace)) * 4.0;\n\t\n\tfloat flow_force = min(flow_base + steepness_map * flow_steepness + distance_map * flow_distance + pressure_map * flow_pressure, flow_max);\n\tflow *= flow_force;\n\t\n\tvec2 jump1 = vec2(0.24, 0.2083333);\n\tfloat time = TIME * flow_speed + flow_foam_noise.a;\n\tvec3 flow_uvA = FlowUVW(UV, flow, jump1, uv_scale, time, false);\n\tvec3 flow_uvB = FlowUVW(UV, flow, jump1, uv_scale, time, true);\n\t\n\t// Level 1 Lava\n\tvec3 lava_nor_bump_a = texture(normal_bump_texture, flow_uvA.xy).rgb;\n\tvec3 lava_nor_bump_b = texture(normal_bump_texture, flow_uvB.xy).rgb;\n\tvec3 lava_nor_bump = lava_nor_bump_a * flow_uvA.z + lava_nor_bump_b * flow_uvB.z;\n\t\n\tvec3 lava_emission_a = texture(emission_texture, flow_uvA.xy).rgb;\n\tvec3 lava_emission_b = texture(emission_texture, flow_uvB.xy).rgb;\n\tvec3 lava_emission = lava_emission_a * flow_uvA.z + lava_emission_b * flow_uvB.z;\n\t\n\tvec2 lava_norFBM = lava_nor_bump.rg;\n\tfloat lava_bumpFBM = lava_nor_bump.b; // TODO - Will we use this?\n\t\n\t// Depthtest\n\tfloat depth_tex = textureLod(DEPTH_TEXTURE, SCREEN_UV, 0.0).r;\n\tfloat depth_tex_unpacked = depth_tex * 2.0 - 1.0;\n\tfloat surface_dist = PROJECTION_MATRIX[3][2] / (depth_tex_unpacked + PROJECTION_MATRIX[2][2]);\n\tfloat lava_depth = surface_dist + VERTEX.z;\n\t\n\tROUGHNESS = roughness;\n\tNORMALMAP = vec3(lava_norFBM, 0);\n\tNORMALMAP_DEPTH = normal_scale;\n\t\n\tfloat emission_t = clamp(lava_depth / emission_depth, 0.0, 1.0);\n\temission_t = ease(emission_t, emission_depth_curve);\n\t\n\tmat4 emission_color_srgb = gradient_lin2srgb(emission_color);\n\tvec3 emission_color_near = vec3(emission_color_srgb[0].x, emission_color_srgb[0].y, emission_color_srgb[0].z);\n\tvec3 emission_color_far = vec3(emission_color_srgb[1].x, emission_color_srgb[1].y, emission_color_srgb[1].z);\n\n\tvec3 final_lava = mix(lava_emission * emission_color_near.rgb, lava_emission * emission_color_far.rgb, emission_t);\n\t\n\tALBEDO = vec3(0.0);\n\tEMISSION = final_lava * emission_energy;\n\t\n\tvec4 world_pos = INV_PROJECTION_MATRIX * vec4(SCREEN_UV * 2.0 - 1.0, depth_tex * 2.0 - 1.0, 1.0);\n\tworld_pos.xyz /= world_pos.w;\n\tALPHA = 1.0;\n\tALPHA *= clamp(1.0 - smoothstep(world_pos.z + edge_fade, world_pos.z, VERTEX.z), 0.0, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/river.shader": "// Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n// See `LICENSE.md` included in the source distribution for details.\nshader_type spatial;\nrender_mode depth_draw_always, specular_schlick_ggx, cull_disabled;\n\n// If you are making your own shader, you can customize or add your own\n// parameters below and they will automatically get parsed and displayed in\n// the River inspector.\n\n// Use prefixes: albedo_, emission_, transparency_, flow_, foam_ and custom_\n// to automatically put your parameters into categories in the inspector.\n\n// If \"curve\" is in the name, the inspector will represent and easing curve.\n// mat4´s with \"color\" in their name will get parsed as gradients.\n\n// Main\nuniform float normal_scale : hint_range(-16.0, 16.0) = 1.0;\nuniform sampler2D normal_bump_texture : hint_normal;\nuniform vec3 uv_scale = vec3(1.0, 1.0, 1.0);\nuniform float roughness : hint_range(0.0, 1.0) = 0.2;\nuniform float edge_fade : hint_range(0.0, 1.0) = 0.25;\n\n// Albedo\nuniform mat4 albedo_color = mat4(vec4(0.0, 0.15, 0.0, 0.0), vec4(0.8, 0.2, 0.0, 0.0), vec4(1.0, 0.5, 0.0, 0.0), vec4(0.0));\nuniform float albedo_depth : hint_range(0.0, 200.0) = 10.0;\nuniform float albedo_depth_curve = 0.25;\n\n// Transparency\nuniform float transparency_clarity : hint_range(0.0, 200.0) = 10.0;\nuniform float transparency_depth_curve = 0.25;\nuniform float transparency_refraction : hint_range(-1.0, 1.0) = 0.05;\n\n// Flow\nuniform float flow_speed : hint_range(0.0, 10.0) = 1.0;\nuniform float flow_base : hint_range(0.0, 8.0) = 0.0;\nuniform float flow_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float flow_distance : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_pressure : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_max : hint_range(0.0, 8.0) = 4.0;\n\n// Foam\nuniform vec4 foam_color : hint_color = vec4(0.9, 0.9, 0.9, 1.0);\nuniform float foam_amount : hint_range(0.0, 4.0) = 2.0;\nuniform float foam_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float foam_smoothness : hint_range(0.0, 1.0) = 0.3;\n\n// Internal uniforms - DO NOT CUSTOMIZE THESE\nuniform float i_lod0_distance : hint_range(5.0, 200.0) = 50.0;\nuniform sampler2D i_texture_foam_noise : hint_white;\nuniform sampler2D i_flowmap : hint_normal;\nuniform sampler2D i_distmap : hint_white;\nuniform bool i_valid_flowmap = false;\nuniform int i_uv2_sides = 2;\n\n\nvec3 FlowUVW(vec2 uv_in, vec2 flowVector, vec2 jump, vec3 tiling, float time, bool flowB) {\n\tfloat phaseOffset = flowB ? 0.5 : 0.0;\n\tfloat progress = fract(time + phaseOffset);\n\tvec3 uvw;\n\tuvw.xy = uv_in - flowVector * (progress - 0.5);\n\tuvw.xy *= tiling.xy;\n\tuvw.xy += phaseOffset;\n\tuvw.xy += (time - progress) * jump;\n\tuvw.z = 1.0 - abs(1.0 - 2.0 * progress);\n\treturn uvw;\n}\n\n// ease implementation copied from math_funcs.cpp in source\nfloat ease(float p_x, float p_c) {\n\tif (p_x < 0.0) {\n\t\tp_x = 0.0;\n\t} else if (p_x > 1.0) {\n\t\tp_x = 1.0;\n\t}\n\tif (p_c > 0.0) {\n\t\tif (p_c < 1.0) {\n\t\t\treturn 1.0 - pow(1.0 - p_x, 1.0 / p_c);\n\t\t} else {\n\t\t\treturn pow(p_x, p_c);\n\t\t}\n\t} else if (p_c < 0.0) {\n\t\t//inout ease\n\t\t\n\t\tif (p_x < 0.5) {\n\t\t\treturn pow(p_x * 2.0, -p_c) * 0.5;\n\t\t} else {\n\t\t\treturn (1.0 - pow(1.0 - (p_x - 0.5) * 2.0, -p_c)) * 0.5 + 0.5;\n\t\t}\n\t} else {\n\t\treturn 0.0; // no ease (raw)\n\t}\n}\n\nfloat lin2srgb(float lin) {\n\treturn pow(lin, 2.2);\n}\n\nmat4 gradient_lin2srgb(mat4 lin_mat) {\n\tmat4 srgb_mat = mat4(\n\t\tvec4(lin2srgb(lin_mat[0].x), lin2srgb(lin_mat[0].y), lin2srgb(lin_mat[0].z), lin2srgb(lin_mat[0].w)),\n\t\tvec4(lin2srgb(lin_mat[1].x), lin2srgb(lin_mat[1].y), lin2srgb(lin_mat[1].z), lin2srgb(lin_mat[1].w)),\n\t\tvec4(0.0),\n\t\tvec4(0.0)\n\t);\n\treturn srgb_mat;\n}\n\nvoid fragment() {\n\t// Sample the UV2 textures. To avoid issues with the UV2 seams, margins\n\t// are left on the textures, so the UV2 needs to be rescaled to cut off\n\t// the margins.\n\tvec2 custom_UV = (UV2 + 1.0 / float(i_uv2_sides)) * (float(i_uv2_sides) / float(i_uv2_sides + 2));\n\tvec4 flow_foam_noise = textureLod(i_flowmap, custom_UV, 0.0);\n\tvec2 dist_pressure = textureLod(i_distmap, custom_UV, 0.0).xy;\n\t\n\tvec2 flow;\n\tfloat distance_map;\n\tfloat pressure_map;\n\tfloat foam_mask;\n\tif (i_valid_flowmap) {\n\t\tflow = flow_foam_noise.xy;\n\t\tdistance_map = (1.0 - dist_pressure.r) * 2.0;\n\t\tpressure_map = dist_pressure.g * 2.0;\n\t\tfoam_mask = flow_foam_noise.b;\n\t} else {\n\t\tflow = vec2(0.5, 0.572);\n\t\tdistance_map = 0.5;\n\t\tpressure_map = 0.5;\n\t\tfoam_mask = 0.0;\n\t}\n\t\n\tflow = (flow - 0.5) * 2.0; // unpack the flow vectors\n\t\n\t// Calculate the steepness map\n\tvec3 flow_viewspace = flow.x * TANGENT + flow.y * BINORMAL;\n\tvec3 up_viewspace = (INV_CAMERA_MATRIX * vec4(0.0, 1.0, 0.0, 0.0)).xyz;\n\tfloat steepness_map = max(0.0, dot(flow_viewspace, up_viewspace)) * 4.0;\n\t\n\tfloat flow_force = min(flow_base + steepness_map * flow_steepness + distance_map * flow_distance + pressure_map * flow_pressure, flow_max);\n\tflow *= flow_force;\n\t\n\tvec2 jump1 = vec2(0.24, 0.2083333);\n\tvec2 jump2 = vec2(0.20, 0.25);\n\tvec2 jump3 = vec2(0.22, 0.27);\n\tfloat time = TIME * flow_speed + flow_foam_noise.a;\n\tvec3 flow_uvA = FlowUVW(UV, flow, jump1, uv_scale, time, false);\n\tvec3 flow_uvB = FlowUVW(UV, flow, jump1, uv_scale, time, true);\n\tvec3 flowx2_uvA = FlowUVW(UV, flow, jump2, uv_scale * 2.0, time, false);\n\tvec3 flowx2_uvB = FlowUVW(UV, flow, jump2, uv_scale * 2.0, time, true);\n\t\n\t// Level 1 Water\n\tvec3 water_a = texture(normal_bump_texture, flow_uvA.xy).rgb;\n\tvec3 water_b = texture(normal_bump_texture, flow_uvB.xy).rgb;\n\tvec3 water = water_a * flow_uvA.z + water_b * flow_uvB.z;\n\n\tvec2 water_norFBM = water.rg;\n\tfloat water_foamFBM = water.b;\n\n\t// Level 2 Water, only add in if closer than lod 0 distance\n\tif (-VERTEX.z < i_lod0_distance) {\n\t\tvec3 waterx2_a = texture(normal_bump_texture, flowx2_uvA.xy).rgb;\n\t\tvec3 waterx2_b = texture(normal_bump_texture, flowx2_uvB.xy, 0.0).rgb;\n\t\tvec3 waterx2 = waterx2_a * flowx2_uvA.z + waterx2_b * flowx2_uvB.z;\n\n\t\twater_norFBM *= 0.65;\n\t\twater_norFBM += waterx2.rg * 0.35;\n\t\twater_foamFBM *= waterx2.b * 2.0;\n\t}\n\t\n\tfloat foam_randomness = texture(i_texture_foam_noise, UV * uv_scale.xy).r;\n\t\n\tfoam_mask += steepness_map * foam_steepness * foam_randomness;\n\tfoam_mask = clamp(foam_mask, 0.0, 1.0);\n\twater_foamFBM = clamp((water_foamFBM * foam_amount) - (0.5 / foam_amount), 0.0, 1.0);\n\tfloat foam_smooth = clamp(water_foamFBM * foam_mask, 0.0, 1.0);\n\tfloat foam_sharp = clamp(water_foamFBM - (1.0 - foam_mask), 0.0, 1.0);\n\tfloat combined_foam = mix(foam_sharp, foam_smooth, foam_smoothness);\n\n\t// Depthtest\n\tfloat depth_tex = textureLod(DEPTH_TEXTURE, SCREEN_UV, 0.0).r;\n\tfloat depth_tex_unpacked = depth_tex * 2.0 - 1.0;\n\tfloat surface_dist = PROJECTION_MATRIX[3][2] / (depth_tex_unpacked + PROJECTION_MATRIX[2][2]);\n\tfloat water_depth = surface_dist + VERTEX.z;\n\t\n\t\n\tfloat alb_t = clamp(water_depth / albedo_depth, 0.0, 1.0);\n\talb_t = ease(alb_t, albedo_depth_curve);\n\tSPECULAR = 0.25; // Supposedly clear water has approximately a 0.25 specular value\n\tROUGHNESS = roughness;\n\tNORMALMAP = vec3(water_norFBM, 0);\n\tNORMALMAP_DEPTH = normal_scale;\n\n\t\n\t// Refraction - has to be done after normal is set\n\tvec3 unpacted_normals = NORMALMAP * 2.0 - 1.0;\n\t//vec3 ref_normal = normalize( mix(NORMAL, TANGENT * unpacted_normals.x + BINORMAL * unpacted_normals.y + NORMAL, NORMALMAP_DEPTH) );\n\tvec3 ref_normal = normalize(TANGENT * unpacted_normals.x + BINORMAL * unpacted_normals.y) * NORMALMAP_DEPTH * .1;\n\tvec2 ref_ofs = SCREEN_UV - ref_normal.xy * transparency_refraction;\n\tfloat clar_t = clamp(water_depth / transparency_clarity, 0.0, 1.0);\n\tclar_t = ease(clar_t, transparency_depth_curve);\n\tfloat ref_amount = 1.0 - clamp(clar_t + combined_foam, 0.0, 1.0);\n\n\t// Depthtest 2\n\tfloat depth_tex2 = textureLod(DEPTH_TEXTURE, ref_ofs, 0.0).r;\n\tfloat depth_tex_unpacked2 = depth_tex2 * 2.0 - 1.0;\n\tfloat surface_dist2 = PROJECTION_MATRIX[3][2] / (depth_tex_unpacked2 + PROJECTION_MATRIX[2][2]);\n\tfloat water_depth2 = surface_dist2 + VERTEX.z;\n\t\n\tif (surface_dist2 < -VERTEX.z) {\n\t\tref_ofs = SCREEN_UV;\n\t} else {\n\t\tclar_t = clamp(water_depth2 / transparency_clarity, 0.0, 1.0);\n\t\tclar_t = ease(clar_t, transparency_depth_curve);\n\t\tref_amount = 1.0 - clamp(clar_t + combined_foam, 0.0, 1.0);\n\t\talb_t = clamp(water_depth2 / albedo_depth, 0.0, 1.0);\n\t\talb_t = ease(alb_t, albedo_depth_curve);\n\t}\n\tmat4 albedo_color_srgb = gradient_lin2srgb(albedo_color);\n\tvec3 albedo_color_near = vec3(albedo_color_srgb[0].x, albedo_color_srgb[0].y, albedo_color_srgb[0].z);\n\tvec3 albedo_color_far = vec3(albedo_color_srgb[1].x, albedo_color_srgb[1].y, albedo_color_srgb[1].z);\n\tvec3 alb_mix = mix(albedo_color_near.rgb, albedo_color_far.rgb, alb_t);\n\tALBEDO = mix(alb_mix, foam_color.rgb, combined_foam);\n\t// TODO - Go over to using texelfetch to get the texture to avoid edge artifacts\n\tEMISSION += textureLod(SCREEN_TEXTURE, ref_ofs, ROUGHNESS * water_depth2).rgb * ref_amount;\n\n\tALBEDO *= 1.0 - ref_amount;\n\tALPHA = 1.0;\n\tTRANSMISSION = vec3(0.9);\n\n\tvec4 world_pos = INV_PROJECTION_MATRIX * vec4(SCREEN_UV * 2.0 - 1.0, depth_tex * 2.0 - 1.0, 1.0);\n\tworld_pos.xyz /= world_pos.w;\n\tALPHA *= clamp(1.0 - smoothstep(world_pos.z + edge_fade, world_pos.z, VERTEX.z), 0.0, 1.0);\n}", "flow/Waterways/addons/waterways/shaders/river_debug.shader": "// Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n// See `LICENSE.md` included in the source distribution for details.\nshader_type spatial;\n\nconst int FLOWMAP = 1;\nconst int FOAMMAP = 2;\nconst int NOISEMAP = 3;\n\nconst int DISTANCEMAP = 4;\nconst int PRESSUREMAP = 5;\n\nconst int FLOW_PATTERN = 6;\nconst int FLOW_ARROWS = 7;\nconst int FLOW_FORCE = 8;\n\nconst int FOAM_MIX = 9;\n\n\nuniform int mode = 1;\n\nuniform sampler2D normal_bump_texture : hint_normal;\nuniform sampler2D debug_pattern : hint_black;\nuniform sampler2D debug_arrow : hint_black;\n\nuniform float flow_speed : hint_range(0.0, 10.0) = 1.0;\nuniform float flow_base : hint_range(0.0, 8.0) = 0.0;\nuniform float flow_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float flow_distance : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_pressure : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_max : hint_range(0.0, 8.0) = 4.0;\n\nuniform float foam_amount : hint_range(0.0, 4.0) = 1.0;\nuniform float foam_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float foam_smoothness : hint_range(0.0, 1.0) = 1.0;\nuniform vec3 uv_scale = vec3(1.0, 1.0, 1.0);\n\nuniform sampler2D i_texture_foam_noise : hint_white;\nuniform sampler2D i_flowmap : hint_black;\nuniform sampler2D i_distmap : hint_white;\nuniform bool i_valid_flowmap = false;\nuniform int i_uv2_sides = 2;\n\n\nvec3 FlowUVW(vec2 uv_in, vec2 flowVector, vec2 jump, vec3 tiling, float time, bool flowB) {\n\tfloat phaseOffset = flowB ? 0.5 : 0.0;\n\tfloat progress = fract(time + phaseOffset);\n\tvec3 uvw;\n\tuvw.xy = uv_in - flowVector * (progress - 0.5);\n\tuvw.xy *= tiling.xy;\n\tuvw.xy += phaseOffset;\n\tuvw.xy += (time - progress) * jump;\n\tuvw.z = 1.0 - abs(1.0 - 2.0 * progress);\n\treturn uvw;\n}\n\nfloat mip_map_level(in vec2 texture_coordinate) {\n    vec2  dx_vtc = dFdx(texture_coordinate);\n    vec2  dy_vtc = dFdy(texture_coordinate);\n    float delta_max_sqr = max(dot(dx_vtc, dx_vtc), dot(dy_vtc, dy_vtc));\n    float mml = 0.5 * log2(delta_max_sqr);\n    return max(0, mml);\n}\n\nvec3 grayscale_to_gradient(float gradient) {\n\tfloat red = clamp(mix(0.0, 2.0, gradient), 0.0, 1.0);\n\tfloat green = clamp(mix(2.0, 0.0, gradient),0.0, 1.0);\n\treturn vec3(red, green, 0.0);\n}\n\nvoid fragment() {\n\tvec2 custom_UV = (UV2 + 1.0 / float(i_uv2_sides)) * (float(i_uv2_sides) / float(i_uv2_sides + 2));\n\tvec4 flow_foam_noise = textureLod(i_flowmap, custom_UV, 0.0);\n\tvec2 dist_pressure = textureLod(i_distmap, custom_UV, 0.0).xy;\n\t\n\tvec2 flow;\n\tfloat foam_mask;\n\tfloat noise_mask;\n\tfloat distance_map;\n\tfloat pressure_map;\n\tif (i_valid_flowmap) {\n\t\tflow = flow_foam_noise.xy;\n\t\tfoam_mask = flow_foam_noise.b;\n\t\tnoise_mask = flow_foam_noise.a;\n\t\tdistance_map = (1.0 - dist_pressure.r) * 2.0;\n\t\tpressure_map = dist_pressure.g * 2.0;\n\t} else {\n\t\tflow = vec2(0.5, 0.572);\n\t\tfoam_mask = 0.0;\n\t\tnoise_mask = 0.0;\n\t\tdistance_map = 0.5;\n\t\tpressure_map = 0.5;\n\t}\n\tflow = (flow - 0.5) * 2.0; // unpack flowmap\n\t\n\t// calculate the steepness map\n\tvec3 flow_viewspace = flow.x * TANGENT + flow.y * BINORMAL;\n\tvec3 up_viewspace = (INV_CAMERA_MATRIX * vec4(0.0, 1.0, 0.0, 0.0)).xyz;\n\tfloat steepness_map = max(0.0, dot(flow_viewspace, up_viewspace)) * 8.0;\n\t\n\tfloat flow_force = min(flow_base + steepness_map * flow_steepness + distance_map * flow_distance + pressure_map * flow_pressure, flow_max);\n\tflow *= flow_force;\n\t\n\tif(mode == FLOWMAP) {\n\t\tALBEDO = vec3((flow + 0.5) / 2.0, 0.0); // repack flowmap\n\t\t\n\t} else if(mode == FOAMMAP) {\n\t\tALBEDO = vec3(foam_mask);\n\t\t\n\t} else if(mode == NOISEMAP) {\n\t\tALBEDO = vec3(noise_mask);\n\t\t\n\t} else if(mode == FLOW_PATTERN) {\n\t\tvec2 jump = vec2(0.24, 0.2083333);\n\t\tfloat time = TIME * flow_speed + flow_foam_noise.a;\n\t\tvec3 flow_uvA = FlowUVW(UV, flow, jump, uv_scale, time, false);\n\t\tvec3 flow_uvB = FlowUVW(UV, flow, jump, uv_scale, time, true);\n\n\t\tvec3 pattern_a = texture(debug_pattern, flow_uvA.xy).rgb;\n\t\tvec3 pattern_b = texture(debug_pattern, flow_uvB.xy).rgb;\n\t\t\n\t\tvec3 pattern = pattern_a * flow_uvA.z + pattern_b * flow_uvB.z;\n\t\t\n\t\tALBEDO = pattern;\n\t\t\n\t} else if(mode == FLOW_ARROWS) {\n\t\tvec2 tiled_UV_raw = UV * uv_scale.xy * 10.0;\n\t\tvec2 tiled_UV = fract(tiled_UV_raw) - 0.5;\n\t\tfloat rotation = atan(flow.y, flow.x) - 3.14 / 2.0;\n\t\tfloat cosine = cos(rotation);\n\t\tfloat sine = sin(rotation);\n\t\tmat2 rotation_mat = mat2(vec2(cosine, -sine), vec2(sine, cosine));\n\t\tvec2 new_uv = rotation_mat * tiled_UV + 0.5;\n\t\tfloat lod = mip_map_level(tiled_UV_raw * vec2(textureSize(debug_arrow, 0)));\n\t\tALBEDO = textureLod(debug_arrow, new_uv, lod).rgb;\n\t\t\n\t} else if(mode == FLOW_FORCE) {\n\t\tfloat gradient = clamp(mix(0.0, 1.0, flow_force / flow_max), 0.0, 1.0);\n\t\tALBEDO = grayscale_to_gradient(gradient);\n\t\t\n\t} else if(mode == FOAM_MIX) {\n\t\t\n\t\tvec2 jump1 = vec2(0.24, 0.2083333);\n\t\tvec2 jump2 = vec2(0.20, 0.25);\n\t\tfloat time = TIME * flow_speed + flow_foam_noise.a;\n\t\tvec3 flow_uvA = FlowUVW(UV, flow, jump1, uv_scale, time, false);\n\t\tvec3 flow_uvB = FlowUVW(UV, flow, jump1, uv_scale, time, true);\n\t\tvec3 flowx2_uvA = FlowUVW(UV, flow, jump2, uv_scale * 2.0, time, false);\n\t\tvec3 flowx2_uvB = FlowUVW(UV, flow, jump2, uv_scale * 2.0, time, true);\n\t\t\n\t\tvec3 water_a = texture(normal_bump_texture, flow_uvA.xy).rgb;\n\t\tvec3 water_b = texture(normal_bump_texture, flow_uvB.xy).rgb;\n\t\tvec3 waterx2_a = texture(normal_bump_texture, flowx2_uvA.xy).rgb;\n\t\tvec3 waterx2_b = texture(normal_bump_texture, flowx2_uvB.xy).rgb;\n\t\tvec3 water = water_a * flow_uvA.z + water_b * flow_uvB.z;\n\t\tvec3 waterx2 = waterx2_a * flowx2_uvA.z + waterx2_b * flowx2_uvB.z;\n\t\t\n\t\tfloat water_foamFBM = water.b; // LOD1\n\t\twater_foamFBM *= waterx2.b * 2.0; // LOD0 - add second level of detail\n\t\tfloat foam_randomness = texture(i_texture_foam_noise, UV * uv_scale.xy).r;\n\t\tfoam_mask += steepness_map * foam_randomness * foam_steepness;\n\t\tfoam_mask = clamp(foam_mask, 0.0, 1.0);\n\t\t\n\t\twater_foamFBM = clamp((water_foamFBM * foam_amount) - (0.5 / foam_amount), 0.0, 1.0);\n\t\t\n\t\tfloat foam_smooth = clamp(water_foamFBM * foam_mask, 0.0, 1.0);\n\t\tfloat foam_sharp = clamp(water_foamFBM - (1.0 - foam_mask), 0.0, 1.0);\n\t\tfloat combined_foam = mix(foam_sharp, foam_smooth, foam_smoothness);\n\t\t\n\t\tALBEDO = vec3(combined_foam);\n\t\t\n\t} else if(mode == DISTANCEMAP) {\n\t\tALBEDO = vec3(dist_pressure.r);\n\t\t\n\t} else if(mode == PRESSUREMAP) {\n\t\tALBEDO = vec3(dist_pressure.g);\n\t\t\n\t}\n}", "flow/Waterways/addons/waterways/shaders/system_renders/alpha.shader": "shader_type spatial;\nrender_mode unshaded;\n\nvoid fragment() {\n\tALBEDO = vec3(1.0);\n}", "flow/Waterways/addons/waterways/shaders/system_renders/system_flow.shader": "shader_type spatial;\nrender_mode unshaded;\n\nuniform sampler2D flowmap : hint_normal;\nuniform sampler2D distmap : hint_white;\nuniform float flow_base : hint_range(0.0, 8.0) = 0.0;\nuniform float flow_steepness : hint_range(0.0, 8.0) = 2.0;\nuniform float flow_distance : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_pressure : hint_range(0.0, 8.0) = 1.0;\nuniform float flow_max : hint_range(0.0, 8.0) = 4.0;\nuniform bool valid_flowmap = false;\n\nvarying vec3 binormal_world;\n\n\nvoid vertex() {\n\tbinormal_world = (WORLD_MATRIX * vec4(BINORMAL, 0.0)).xyz;\n}\n\nvoid fragment() {\n\tvec2 flow_foam_noise = textureLod(flowmap, UV2, 0.0).rg;\n\tvec2 dist_pressure = textureLod(distmap, UV2, 0.0).xy;\n\t\n\tvec2 flow;\n\tfloat distance_map;\n\tfloat pressure_map;\n\tif (valid_flowmap) {\n\t\tflow = flow_foam_noise.xy;\n\t\tdistance_map = (1.0 - dist_pressure.r) * 2.0;\n\t\tpressure_map = dist_pressure.g * 2.0;\n\t} else {\n\t\tflow = vec2(0.5, 0.572);\n\t\tdistance_map = 0.5;\n\t\tpressure_map = 0.5;\n\t}\n\t\n\tflow = (flow - 0.5) * 2.0; // remap\n\t\n\t// calculate the steepness map\n\tvec3 flow_viewspace = flow.x * TANGENT + flow.y * BINORMAL;\n\tvec3 up_viewspace = (INV_CAMERA_MATRIX * vec4(0.0, 1.0, 0.0, 0.0)).xyz;\n\tfloat steepness_map = max(0.0, dot(flow_viewspace, up_viewspace)) * 4.0;\n\t\n\tfloat flow_force = min(flow_base + steepness_map * flow_steepness + distance_map * flow_distance + pressure_map * flow_pressure, flow_max);\n\tflow *= flow_force;\n\t\n\tfloat rotation = atan(-binormal_world.x, -binormal_world.z);\n\tfloat cosine = cos(rotation);\n\tfloat sine = sin(rotation);\n\tmat2 rotation_mat = mat2(vec2(cosine, -sine), vec2(sine, cosine));\n\tvec2 new_flow = rotation_mat * flow;\n\tALBEDO = vec3((new_flow), 0.0) * 0.5 + 0.5; // repack flowmap\n}", "flow/Waterways/addons/waterways/shaders/system_renders/system_height.shader": "shader_type spatial;\nrender_mode unshaded;\n\nuniform float lower_bounds = 0.0;\nuniform float upper_bounds = 10.0;\nvarying vec3 vertex_trans;\n\nvoid vertex() {\n\tvertex_trans = (WORLD_MATRIX * vec4(VERTEX, 1.0)).xyz;\n}\n\nvoid fragment() {\n\tfloat range = upper_bounds - lower_bounds;\n\tALBEDO = vec3( clamp((vertex_trans.y - lower_bounds) / range, 0.0, 1.0) );\n}", "flow/Waterways/addons/waterways/system_map_renderer.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\ntool\nextends Viewport\n\nconst HEIGHT_SHADER_PATH = \"res://addons/waterways/shaders/system_renders/system_height.shader\"\nconst FLOW_SHADER_PATH = \"res://addons/waterways/shaders/system_renders/system_flow.shader\"\nconst ALPHA_SHADER_PATH = \"res://addons/waterways/shaders/system_renders/alpha.shader\"\n\nvar _camera : Camera\nvar _container : Spatial\n\nfunc grab_height(water_objects, aabb : AABB, resolution : float) -> ImageTexture:\n\tsize = Vector2(resolution, resolution)\n\t_camera = $Camera\n\t_container = $Container\n\t\n\tvar height_mat = ShaderMaterial.new()\n\tvar height_shader := load(HEIGHT_SHADER_PATH) as Shader\n\theight_mat.shader = height_shader\n\theight_mat.set_shader_param(\"lower_bounds\", aabb.position.y)\n\theight_mat.set_shader_param(\"upper_bounds\", aabb.end.y)\n\t\n\tfor object in water_objects:\n\t\tvar water_mesh_copy = object.mesh_instance.duplicate(true)\n\t\t_container.add_child(water_mesh_copy)\n\t\twater_mesh_copy.transform = object.transform\n\t\twater_mesh_copy.material_override = height_mat\n\t\n\tvar longest_axis := aabb.get_longest_axis_index()\n\tmatch longest_axis:\n\t\tVector3.AXIS_X:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.x / 2.0, aabb.size.y + 1.0, aabb.size.x / 2.0)\n\t\tVector3.AXIS_Y:\n\t\t\t# TODO\n\t\t\t# This shouldn't happen, we might need some code to handle if it does\n\t\t\tpass\n\t\tVector3.AXIS_Z:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.z / 2.0, aabb.size.y + 1.0, aabb.size.z / 2.0)\n\t\n\t_camera.size = aabb.get_longest_axis_size()\n\t_camera.far = aabb.size.y + 2.0\n\t\n\trender_target_clear_mode = CLEAR_MODE_ALWAYS\n\trender_target_update_mode = Viewport.UPDATE_ONCE\n\tupdate_worlds()\n\tyield(get_tree(), \"idle_frame\")\n\tyield(get_tree(), \"idle_frame\")\n\t\n\tvar height := get_texture().get_data()\n\tvar height_result := ImageTexture.new()\n\theight_result.create_from_image(height)\n\t\n\tfor child in _container.get_children():\n\t\t_container.remove_child(child)\n\t\n\treturn height_result\n\n\nfunc grab_alpha(water_objects, aabb : AABB, resolution : float) -> ImageTexture:\n\tsize = Vector2(resolution, resolution)\n\t_camera = $Camera\n\t_container = $Container\n\t\n\tvar alpha_mat = ShaderMaterial.new()\n\tvar alpha_shader := load(ALPHA_SHADER_PATH) as Shader\n\talpha_mat.shader = alpha_shader\n\t\n\tfor object in water_objects:\n\t\tvar water_mesh_copy = object.mesh_instance.duplicate(true)\n\t\t_container.add_child(water_mesh_copy)\n\t\twater_mesh_copy.transform = object.transform\n\t\twater_mesh_copy.material_override = alpha_mat\n\t\n\tvar longest_axis := aabb.get_longest_axis_index()\n\tmatch longest_axis:\n\t\tVector3.AXIS_X:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.x / 2.0, aabb.size.y + 1.0, aabb.size.x / 2.0)\n\t\tVector3.AXIS_Y:\n\t\t\t# This shouldn't happen, we might need some code to handle if it does\n\t\t\tpass\n\t\tVector3.AXIS_Z:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.z / 2.0, aabb.size.y + 1.0, aabb.size.z / 2.0)\n\t\n\t_camera.size = aabb.get_longest_axis_size()\n\t_camera.far = aabb.size.y + 2.0\n\t\n\trender_target_clear_mode = CLEAR_MODE_ALWAYS\n\trender_target_update_mode = Viewport.UPDATE_ONCE\n\tupdate_worlds()\n\tyield(get_tree(), \"idle_frame\")\n\tyield(get_tree(), \"idle_frame\")\n\t\n\tvar alpha := get_texture().get_data()\n\tvar alpha_result := ImageTexture.new()\n\talpha_result.create_from_image(alpha)\n\t\n\tfor child in _container.get_children():\n\t\t_container.remove_child(child)\n\t\n\treturn alpha_result\n\n\nfunc grab_flow(water_objects, aabb : AABB, resolution : float) -> ImageTexture:\n\tsize = Vector2(resolution, resolution)\n\t_camera = $Camera\n\t_container = $Container\n\t\n\tvar flow_mat = ShaderMaterial.new()\n\tvar flow_shader := load(FLOW_SHADER_PATH) as Shader\n\tflow_mat.shader = flow_shader\n\n\tfor i in water_objects.size():\n\t\tvar water_mesh_copy = water_objects[i].mesh_instance.duplicate(true)\n\t\t_container.add_child(water_mesh_copy)\n\t\twater_mesh_copy.transform = water_objects[i].transform\n\t\twater_mesh_copy.material_override = flow_mat\n\t\twater_mesh_copy.material_override.set_shader_param(\"flowmap\", water_objects[i].flow_foam_noise)\n\t\twater_mesh_copy.material_override.set_shader_param(\"distmap\", water_objects[i].dist_pressure)\n\t\twater_mesh_copy.material_override.set_shader_param(\"flow_base\", water_objects[i].get_shader_param(\"flow_base\"))\n\t\twater_mesh_copy.material_override.set_shader_param(\"flow_steepness\", water_objects[i].get_shader_param(\"flow_steepness\"))\n\t\twater_mesh_copy.material_override.set_shader_param(\"flow_distance\", water_objects[i].get_shader_param(\"flow_distance\"))\n\t\twater_mesh_copy.material_override.set_shader_param(\"flow_pressure\", water_objects[i].get_shader_param(\"flow_pressure\"))\n\t\twater_mesh_copy.material_override.set_shader_param(\"flow_max\", water_objects[i].get_shader_param(\"flow_max\"))\n\t\twater_mesh_copy.material_override.set_shader_param(\"valid_flowmap\", water_objects[i].get_shader_param(\"i_valid_flowmap\"))\n\t\n\tvar longest_axis := aabb.get_longest_axis_index()\n\tmatch longest_axis:\n\t\tVector3.AXIS_X:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.x / 2.0, aabb.size.y + 1.0, aabb.size.x / 2.0)\n\t\tVector3.AXIS_Y:\n\t\t\t# This shouldn't happen, we might need some code to handle if it does\n\t\t\tpass\n\t\tVector3.AXIS_Z:\n\t\t\t_camera.translation = aabb.position + Vector3(aabb.size.z / 2.0, aabb.size.y + 1.0, aabb.size.z / 2.0)\n\t\n\t_camera.size = aabb.get_longest_axis_size()\n\t_camera.far = aabb.size.y + 2.0\n\t\n\trender_target_clear_mode = CLEAR_MODE_ALWAYS\n\trender_target_update_mode = Viewport.UPDATE_ONCE\n\tupdate_worlds()\n\tyield(get_tree(), \"idle_frame\")\n\tyield(get_tree(), \"idle_frame\")\n\t\n\tvar flow := get_texture().get_data()\n\tvar flow_result := ImageTexture.new()\n\tflow_result.create_from_image(flow)\n\t\n\tfor child in _container.get_children():\n\t\t_container.remove_child(child)\n\t\n\treturn flow_result\n", "flow/Waterways/addons/waterways/water_helper_methods.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\n\nstatic func cart2bary(p : Vector3, a : Vector3, b : Vector3, c: Vector3) -> Vector3:\n\tvar v0 := b - a\n\tvar v1 := c - a\n\tvar v2 := p - a\n\tvar d00 := v0.dot(v0)\n\tvar d01 := v0.dot(v1)\n\tvar d11 := v1.dot(v1)\n\tvar d20 := v2.dot(v0)\n\tvar d21 := v2.dot(v1)\n\tvar denom := d00 * d11 - d01 * d01\n\tvar v = (d11 * d20 - d01 * d21) / denom\n\tvar w = (d00 * d21 - d01 * d20) / denom\n\tvar u = 1.0 - v - w\n\treturn Vector3(u, v, w)\n\n\nstatic func bary2cart(a : Vector3, b : Vector3, c: Vector3, barycentric: Vector3) -> Vector3:\n\treturn barycentric.x * a + barycentric.y * b + barycentric.z * c\n\n\nstatic func point_in_bariatric(v : Vector3) -> bool:\n\treturn 0 <= v.x and v.x <= 1 and 0 <= v.y and v.y <= 1 and 0 <= v.z and v.z <= 1;\n\n\nstatic func reset_all_colliders(node):\n\tfor n in node.get_children():\n\t\tif n.get_child_count() > 0:\n\t\t\treset_all_colliders(n)\n\t\tif n is CollisionShape:\n\t\t\tif n.disabled == false:\n\t\t\t\tn.disabled = true\n\t\t\t\tn.disabled = false\n\n\nstatic func sum_array(array) -> float:\n\tvar sum = 0.0\n\tfor element in array:\n\t\t\tsum += element\n\treturn sum\n\n\nstatic func calculate_side(steps : int) -> int:\n\tvar side_float : float = sqrt(steps)\n\tif fmod(side_float, 1.0) != 0.0:\n\t\tside_float += 1.0\n\treturn int(side_float)\n\n\nstatic func generate_river_width_values(curve : Curve3D, steps : int, step_length_divs : int, step_width_divs : int, widths : Array) -> Array:\n\tvar river_width_values := []\n\tvar length = curve.get_baked_length()\n\tfor step in steps * step_length_divs + 1:\n\t\tvar target_pos = curve.interpolate_baked((float(step) / float(steps * step_length_divs + 1)) * curve.get_baked_length())\n\t\tvar closest_dist := 4096.0\n\t\tvar closest_interpolate : float\n\t\tvar closest_point : int\n\t\tfor c_point in curve.get_point_count() - 1:\n\t\t\tfor i in 100:\n\t\t\t\tvar interpolate := float(i) / 100.0\n\t\t\t\tvar pos = curve.interpolate(c_point, interpolate)\n\t\t\t\tvar dist = pos.distance_to(target_pos)\n\t\t\t\tif dist < closest_dist:\n\t\t\t\t\tclosest_dist = dist\n\t\t\t\t\tclosest_interpolate = interpolate\n\t\t\t\t\tclosest_point = c_point\n\t\triver_width_values.append( lerp(widths[closest_point], widths[closest_point + 1], closest_interpolate) )\n\t\n\treturn river_width_values\n\n\nstatic func generate_river_mesh(curve : Curve3D, steps : int, step_length_divs : int, step_width_divs : int, smoothness : float, river_width_values : Array) -> Mesh:\n\tvar st := SurfaceTool.new()\n\tst.begin(Mesh.PRIMITIVE_TRIANGLES)\n\tvar curve_length := curve.get_baked_length()\n\tst.add_smooth_group(true)\n\t\n\t# Generating the verts\n\tfor step in steps * step_length_divs + 1:\n\t\tvar position := curve.interpolate_baked(float(step) / float(steps * step_length_divs) * curve_length, false)\n\t\tvar backward_pos := curve.interpolate_baked((float(step) - smoothness) / float(steps * step_length_divs) * curve_length, false)\n\t\tvar forward_pos := curve.interpolate_baked((float(step) + smoothness) / float(steps * step_length_divs) * curve_length, false)\n\t\tvar forward_vector := forward_pos - backward_pos\n\t\tvar right_vector := forward_vector.cross(Vector3.UP).normalized()\n\t\t\n\t\tvar width_lerp : float = river_width_values[step]\n\t\t\n\t\tfor w_sub in step_width_divs + 1:\n\t\t\tst.add_uv(Vector2(float(w_sub) / (float(step_width_divs)), float(step) / float(step_length_divs) ))\n\t\t\tst.add_vertex(position + right_vector * width_lerp - 2.0 * right_vector * width_lerp * float(w_sub) / (float(step_width_divs)))\n\t\n\t# Defining the tris\n\tfor step in steps * step_length_divs:\n\t\tfor w_sub in step_width_divs:\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub)\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub + 1)\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub + 2 + step_width_divs - 1)\n\t\t\t\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub + 1)\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub + 3 + step_width_divs - 1)\n\t\t\tst.add_index( (step * (step_width_divs + 1)) + w_sub + 2 + step_width_divs - 1)\n\t\t\n\tst.generate_normals()\n\tst.generate_tangents()\n\tst.deindex()\n\n\tvar mesh := ArrayMesh.new()\n\tvar mesh2 :=  ArrayMesh.new()\n\tvar mesh3 := ArrayMesh.new()\n\tmesh = st.commit()\n\n\tvar mdt := MeshDataTool.new()\n\tmdt.create_from_surface(mesh, 0)\n\n\t# Generate UV2\n\t# Decide on grid size\n\tvar grid_side := calculate_side(steps)\n\tvar grid_side_length := 1.0 / float(grid_side)\n\tvar x_grid_sub_length := grid_side_length / float(step_width_divs)\n\tvar y_grid_sub_length := grid_side_length / float(step_length_divs)\n\tvar grid_size := pow(grid_side, 2)\n\tvar index := 0\n\tvar UVs := steps * step_width_divs * step_length_divs * 6\n\tvar x_offset := 0.0\n\tfor x in grid_side:\n\t\tvar y_offset := 0.0\n\t\tfor y in grid_side:\n\t\t\n\t\t\tif index < UVs:\n\t\t\t\tvar sub_y_offset := 0.0\n\t\t\t\tfor sub_y in step_length_divs:\n\t\t\t\t\tvar sub_x_offset := 0.0\n\t\t\t\t\tfor sub_x in step_width_divs:\n\t\t\t\t\t\tvar x_comb_offset := x_offset + sub_x_offset\n\t\t\t\t\t\tvar y_comb_offset := y_offset + sub_y_offset\n\t\t\t\t\t\tmdt.set_vertex_uv2(index, Vector2(x_comb_offset, y_comb_offset))\n\t\t\t\t\t\tmdt.set_vertex_uv2(index + 1, Vector2(x_comb_offset + x_grid_sub_length, y_comb_offset))\n\t\t\t\t\t\tmdt.set_vertex_uv2(index + 2, Vector2(x_comb_offset, y_comb_offset + y_grid_sub_length))\n\t\t\t\t\t\t\n\t\t\t\t\t\tmdt.set_vertex_uv2(index + 3, Vector2(x_comb_offset + x_grid_sub_length, y_comb_offset))\n\t\t\t\t\t\tmdt.set_vertex_uv2(index + 4, Vector2(x_comb_offset + x_grid_sub_length, y_comb_offset + y_grid_sub_length))\n\t\t\t\t\t\tmdt.set_vertex_uv2(index + 5, Vector2(x_comb_offset, y_comb_offset + y_grid_sub_length))\n\t\t\t\t\t\tindex += 6\n\t\t\t\t\t\tsub_x_offset += grid_side_length / float(step_width_divs)\n\t\t\t\t\tsub_y_offset += grid_side_length / float(step_length_divs)\n\t\t\t\n\t\t\ty_offset += grid_side_length\n\t\tx_offset += grid_side_length\n\t\n\tmdt.commit_to_surface(mesh2)\n\tst.clear()\n\tst.create_from(mesh2, 0)\n\tst.index()\n\tmesh3 = st.commit()\n\treturn mesh3\n\n\nstatic func generate_collisionmap(image : Image, mesh_instance : MeshInstance, raycast_dist : float, raycast_layers : int, steps : int, step_length_divs : int, step_width_divs : int, river) -> Image:\n\tvar space_state := mesh_instance.get_world().direct_space_state\n\t\n\tvar uv2 := mesh_instance.mesh.surface_get_arrays(0)[5] as PoolVector2Array\n\tvar verts := mesh_instance.mesh.surface_get_arrays(0)[0] as PoolVector3Array\n\t# We need to move the verts into world space\n\tvar world_verts := PoolVector3Array()\n\tfor v in verts.size():\n\t\tworld_verts.append( mesh_instance.global_transform.xform(verts[v]) )\n\t\n\tvar tris_in_step_quad := step_length_divs * step_width_divs * 2\n\tvar side := calculate_side(steps)\n\tvar percentage = 0.0\n\triver.emit_signal(\"progress_notified\", percentage, \"Calculating Collisions (\" + str(image.get_width()) + \"x\" + str(image.get_width()) + \")\")\n\tyield(river.get_tree(), \"idle_frame\")\n\tfor x in image.get_width():\n\t\tvar cur_percentage = float(x) / float(image.get_width())\n\t\tif cur_percentage > percentage + 0.1:\n\t\t\tpercentage += 0.1\n\t\t\triver.emit_signal(\"progress_notified\", percentage, \"Calculating Collisions (\" + str(image.get_width()) + \"x\" + str(image.get_width()) + \")\")\n\t\t\tyield(river.get_tree(), \"idle_frame\")\n\t\tfor y in image.get_height():\n\t\t\tvar uv_coordinate := Vector2( ( 0.5 + float(x))  / float(image.get_width()), ( 0.5 + float(y)) / float(image.get_height()) )\n\t\t\tvar baryatric_coords : Vector3\n\t\t\tvar correct_triangle := []\n\t\t\t\n\t\t\tvar pixel := int(x * image.get_width() + y)\n\t\t\tvar column := (pixel / image.get_width()) / (image.get_width() / side)\n\t\t\tvar row := (pixel % image.get_width()) / (image.get_width() / side)\n\t\t\tvar step_quad := column * side + row\n\t\t\t\t\n\t\t\tif step_quad >= steps:\n\t\t\t\tbreak # we are in the empty part of UV2 so we break to the next column\n\t\t\t\n\t\t\tfor tris in
