me(Err(IllegalHalfEdgeCollapse::IntersectionOfOneRing)) => Some(tri_idx),\n                Some(Err(e)) => {\n                    warn!(\"Invalid collapse: {:?} (from {} to {})\", e, from, to);\n                    None\n                }\n                _ => None,\n            }\n        })\n        .collect();\n\n    (remaining, processed)\n}\n\n#[allow(unused)]\nfn process_triangle_collapse_queue_iterative<R: Real>(\n    mesh: &mut HalfEdgeTriMesh<R>,\n    triangles: impl Iterator<Item = usize>,\n) -> usize {\n    profile!(\"process_triangle_collapse_queue_iterative\");\n    let (mut remaining, mut processed) = process_triangle_collapse_queue(mesh, triangles);\n    let mut iter = 1;\n    info!(\n        \"{} collapse operations remaining after pass {}\",\n        remaining.len(),\n        iter\n    );\n    while !remaining.is_empty() && iter < 5 {\n        iter += 1;\n        let (remaining_new, processed_new) =\n            process_triangle_collapse_queue(mesh, remaining.into_iter());\n        remaining = remaining_new;\n        processed += processed_new;\n        info!(\n            \"{} collapse operations remaining after pass {}\",\n            remaining.len(),\n            iter\n        );\n    }\n\n    processed\n}\n\nfn process_collapse_queue<R: Real>(\n    mesh: &mut HalfEdgeTriMesh<R>,\n    collapses: impl Iterator<Item = (usize, usize)>,\n) -> SetType<(usize, usize)> {\n    collapses\n        .flat_map(|(from, to)| {\n            if let Some(he) = mesh.half_edge(from, to) {\n                match mesh.try_half_edge_collapse(he) {\n                    Ok(_) => None,\n                    Err(IllegalHalfEdgeCollapse::IntersectionOfOneRing) => Some((from, to)),\n                    Err(e) => {\n                        warn!(\"Invalid collapse: {:?} (from {} to {})\", e, from, to);\n                        None\n                    }\n                }\n            } else {\n                warn!(\n                    \"Invalid collapse: Half-edge missing (from {} to {})\",\n                    from, to\n                );\n                None\n            }\n        })\n        .collect()\n}\n\nfn process_collapse_queue_iterative<R: Real>(\n    mesh: &mut HalfEdgeTriMesh<R>,\n    collapses: impl Iterator<Item = (usize, usize)>,\n) {\n    profile!(\"process_collapse_queue_iterative\");\n    let mut remaining = process_collapse_queue(mesh, collapses);\n    let mut iter = 1;\n    info!(\n        \"{} collapse operations remaining after pass {}\",\n        remaining.len(),\n        iter\n    );\n    while !remaining.is_empty() && iter < 5 {\n        iter += 1;\n        remaining = process_collapse_queue(mesh, remaining.into_iter());\n        info!(\n            \"{} collapse operations remaining after pass {}\",\n            remaining.len(),\n            iter\n        );\n    }\n}\n\npub fn merge_single_barnacle_configurations_he<R: Real>(mesh: &mut HalfEdgeTriMesh<R>) {\n    profile!(\"merge_single_barnacle_configurations\");\n\n    //let vertex_map = &mesh.vertex_map;\n\n    let half_edge_collapses = {\n        profile!(\"find candidates\");\n\n        let mut candidates = mesh\n            .vertices\n            .par_iter()\n            .enumerate()\n            .filter_map(|(i, _v_i)| {\n                (mesh.vertex_one_ring_len(i) == 4\n                    && mesh\n                        .vertex_one_ring(i)\n                        .map(|j| mesh.vertex_one_ring_len(j))\n                        .all(|len| (4..=6).contains(&len))\n                    && mesh\n                        .vertex_one_ring(i)\n                        .map(|j| mesh.vertex_one_ring_len(j))\n                        .sum::<usize>()\n                        == 20)\n                    .then_some(i)\n            })\n            .collect::<SetType<_>>();\n\n        info!(\"Found {} single barnacle candidates\", candidates.len());\n\n        let invalid_candidates = candidates\n            .par_iter()\n            .copied()\n            .filter_map(|c| {\n                mesh.vertex_one_ring(c)\n                    .any(|i| candidates.contains(&i))\n                    .then_some(c)\n            })\n            .collect::<Vec<_>>();\n        info!(\n            \"Filtered out {} adjacent candidates\",\n            invalid_candidates.len()\n        );\n        invalid_candidates.into_iter().for_each(|c| {\n            candidates.remove(&c);\n        });\n\n        /*\n        let mut max_angles = candidates\n            .iter()\n            .copied()\n            .map(|c| {\n                let mut max_angle = R::zero();\n                for j in mesh.vertex_one_ring(c) {\n                    if let Some(he) = mesh.half_edge(j, c) {\n                        if let Ok(_) = mesh.is_collapse_ok(he) {\n                            max_angle =\n                                max_angle.max(mesh.half_edge_collapse_max_normal_change(he));\n                            println!(\"max_angle: {}\", max_angle);\n                        }\n                    }\n                }\n                println!(\n                    \"max angle change for config {}: {}\\n\\n\",\n                    c,\n                    max_angle.to_f32().unwrap().to_degrees()\n                );\n                (c, max_angle.to_f32().unwrap().to_degrees())\n            })\n            .collect::<Vec<_>>();\n        max_angles.sort_by(|a, b| a.1.partial_cmp(&b.1).unwrap());\n        dbg!(max_angles);\n         */\n\n        let half_edge_collapses = candidates\n            .iter()\n            .copied()\n            .flat_map(|c| mesh.vertex_one_ring(c).map(move |i| (i, c)))\n            .collect::<MapType<usize, usize>>();\n\n        info!(\"Enqueued {} collapse operations\", half_edge_collapses.len());\n\n        half_edge_collapses\n    };\n\n    process_collapse_queue_iterative(mesh, half_edge_collapses.iter().map(|(i, j)| (*i, *j)));\n}\n\npub fn merge_double_barnacle_configurations_he<R: Real>(mesh: &mut HalfEdgeTriMesh<R>) {\n    profile!(\"merge_double_barnacle_configurations\");\n\n    let is_center_candidate = |i: usize| -> bool {\n        if mesh.vertex_one_ring_len(i) == 5 {\n            let mut neighbor_count =\n                std::array::from_fn(|j| mesh.vertex_one_ring_len(mesh.vertex_one_ring_ith(i, j)));\n            neighbor_count.sort_unstable();\n            neighbor_count == [5, 5, 5, 6, 6]\n        } else {\n            false\n        }\n    };\n\n    let half_edge_collapses = {\n        profile!(\"find candidates\");\n\n        let sorted_pair = |i: usize, j: usize| -> (usize, usize) {\n            let a = i.min(j);\n            let b = j.max(i);\n            (a, b)\n        };\n\n        let mut candidate_pairs = mesh\n            .vertices\n            .par_iter()\n            .enumerate()\n            .filter_map(|(i, _v_i)| {\n                if is_center_candidate(i) {\n                    let mut count = 0;\n                    let mut other = 0;\n\n                    // Identify the second center vertex of the double config\n                    for j in mesh.vertex_one_ring(i) {\n                        if is_center_candidate(j) {\n                            count += 1;\n                            other = j;\n                        }\n                    }\n\n                    // Sort the candidate pair to avoid duplicates\n                    (count == 1).then_some(sorted_pair(i, other))\n                } else {\n                    None\n                }\n            })\n            .collect::<SetType<_>>();\n\n        info!(\"Found {} double barnacle candidates\", candidate_pairs.len(),);\n\n        // First filter out any candidate pair with one vertex of the pair being part of another pair\n        // This allows to make a unique vertex -> pair mapping in the next step\n        {\n            let is_double_candidate_overlapping = |i: usize, j: usize| {\n                let pair = sorted_pair(i, j);\n                mesh.vertex_one_ring(i).any(|k| {\n                    let other_pair = sorted_pair(i, k);\n                    // Only filter out one side of the adjacency\n                    let is_smaller = other_pair < pair;\n                    k != j && is_smaller && candidate_pairs.contains(&other_pair)\n                })\n            };\n\n            let invalid_candidates = candidate_pairs\n                .par_iter()\n                .copied()\n                .filter_map(|(i, j)| {\n                    (is_double_candidate_overlapping(i, j) || is_double_candidate_overlapping(j, i))\n                        .then_some((i, j))\n                })\n                .collect::<Vec<_>>();\n            info!(\n                \"Filtered out {} overlapping candidates\",\n                invalid_candidates.len()\n            );\n\n            invalid_candidates.into_iter().for_each(|c| {\n                candidate_pairs.remove(&c);\n            });\n        }\n\n        // Filter out any candidate pairs whose neighbors overlap with another candidate pair\n        {\n            // Collect unique mapping of all center vertices to their candidate pair\n            let mut candidate_to_pair_map = MapType::default();\n            for (i, j) in candidate_pairs.iter().copied() {\n                candidate_to_pair_map.insert(i, sorted_pair(i, j));\n                candidate_to_pair_map.insert(j, sorted_pair(i, j));\n            }\n\n            // Checks if any neighbor of `i` has a neighbor that belongs to a different candidate pair than `(i,j)`\n            let is_double_candidate_adjacent = |i: usize, j: usize| -> bool {\n                let pair = sorted_pair(i, j);\n                mesh.vertex_one_ring(i)\n                    .filter(|k| *k != j)\n                    .flat_map(|k| mesh.vertex_one_ring(k).filter(move |&l| l != i && l != j))\n                    .any(|l| {\n                        if let Some(other_pair) = candidate_to_pair_map.get(&l) {\n                            return *other_pair < pair;\n                        }\n                        false\n                    })\n            };\n\n            let invalid_candidates = candidate_pairs\n                .par_iter()\n                .copied()\n                .filter_map(|(i, j)| {\n                    (is_double_candidate_adjacent(i, j) || is_double_candidate_adjacent(j, i))\n                        .then_some((i, j))\n                })\n                .collect::<Vec<_>>();\n            info!(\n                \"Filtered out {} adjacent neighbor candidates\",\n                invalid_candidates.len()\n            );\n\n            invalid_candidates.into_iter().for_each(|c| {\n                candidate_pairs.remove(&c);\n            });\n        }\n\n        // Collect the actual half-edge collapses to perform\n        let mut half_edge_collapses = MapType::default();\n        for (i, j) in candidate_pairs {\n            let mut insert_replacement = |i: usize, j: usize, k: usize| {\n                if k != j {\n                    if mesh.vertex_one_ring(k).all(|l| l != j) {\n                        half_edge_collapses.insert(k, i);\n                    } else if (mesh.vertices[k] - mesh.vertices[i]).norm()\n                        <= (mesh.vertices[k] - mesh.vertices[j]).norm()\n                    {\n                        half_edge_collapses.insert(k, i);\n                    } else {\n                        half_edge_collapses.insert(k, j);\n                    }\n                }\n            };\n\n            for k in mesh.vertex_one_ring(i) {\n                insert_replacement(i, j, k);\n            }\n\n            for k in mesh.vertex_one_ring(j) {\n                insert_replacement(j, i, k);\n            }\n        }\n\n        info!(\"Enqueued {} collapse operations\", half_edge_collapses.len());\n\n        half_edge_collapses\n    };\n\n    process_collapse_queue_iterative(mesh, half_edge_collapses.iter().map(|(i, j)| (*i, *j)));\n}\n\n/// Merges triangles sharing an edge to quads if they fulfill the given criteria\npub fn convert_tris_to_quads<R: Real>(\n    mesh: &TriMesh3d<R>,\n    non_squareness_limit: R,\n    normal_angle_limit: R,\n    max_interior_angle: R,\n) -> MixedTriQuadMesh3d<R> {\n    profile!(\"tri_to_quad\");\n\n    let vert_tri_map = mesh.vertex_cell_connectivity();\n    let tri_normals = mesh\n        .triangles\n        .par_iter()\n        .map(|tri| {\n            let v0 = &mesh.vertices[tri[0]];\n            let v1 = &mesh.vertices[tri[1]];\n            let v2 = &mesh.vertices[tri[2]];\n            (v1 - v0).cross(&(v2 - v1)).normalize()\n        })\n        .collect::<Vec<_>>();\n\n    let min_dot = normal_angle_limit.cos();\n    let max_non_squareness = non_squareness_limit;\n    let sqrt_two = R::from_float(2.0_f64.sqrt());\n\n    let tris_to_quad = |tri_i: &[usize; 3], tri_j: &[usize; 3]| -> [usize; 4] {\n        let mut quad = [0, 0, 0, 0];\n        let missing_vertex: usize = tri_j.iter().copied().find(|v| !tri_i.contains(v)).unwrap();\n\n        quad[0] = tri_i[0];\n        if tri_j.contains(&tri_i[0]) {\n            if tri_j.contains(&tri_i[1]) {\n                quad[1] = missing_vertex;\n                quad[2] = tri_i[1];\n                quad[3] = tri_i[2];\n            } else {\n                quad[1] = tri_i[1];\n                quad[2] = tri_i[2];\n                quad[3] = missing_vertex;\n            }\n        } else if tri_j.contains(&tri_i[1]) {\n            quad[1] = tri_i[1];\n            quad[2] = missing_vertex;\n            quad[3] = tri_i[2];\n        } else {\n            panic!(\"this should not happen\");\n        }\n\n        quad\n    };\n\n    /// Computes the interior angle of a quad at vertex v_center with the quad given by [v_prev, v_center, v_next, v_opp]\n    fn quad_interior_angle<R: Real>(\n        v_center: &Vector3<R>,\n        v_prev: &Vector3<R>,\n        v_next: &Vector3<R>,\n        v_opp: &Vector3<R>,\n    ) -> R {\n        let d_prev = v_prev - v_center;\n        let d_middle = v_opp - v_center;\n        let d_next = v_next - v_center;\n\n        let l_prev = d_prev.norm();\n        let l_middle = d_middle.norm();\n        let l_next = d_next.norm();\n\n        let angle_prev = (d_prev.dot(&d_middle)).unscale(l_prev * l_middle).acos();\n        let angle_next = (d_middle.dot(&d_next)).unscale(l_middle * l_next).acos();\n\n        angle_prev + angle_next\n    }\n\n    let quad_candidates = mesh\n        .triangles\n        .par_iter()\n        .enumerate()\n        .filter_map(|(i, tri_i)| {\n            for &vert in tri_i {\n                // Loop over all triangles of all vertices of the triangle from iterator chain\n                for &j in &vert_tri_map[vert] {\n                    // Skip triangle from iterator chain and make sure that we process every triangle pair only once\n                    if j <= i {\n                        continue;\n                    } else {\n                        let tri_j = &mesh.triangles[j];\n                        let mut recurring_verts = 0;\n                        let mut other_vert = 0;\n                        for &v in tri_j {\n                            if tri_i.contains(&v) {\n                                recurring_verts += 1;\n                                if v != vert {\n                                    other_vert = v;\n                                }\n                            }\n                        }\n\n                        // Found triangle pair with shared edge\n                        if recurring_verts == 2 {\n                            let mut convert = false;\n                            let mut quality = R::one();\n\n                            // Check \"squareness\" of the two triangles\n                            {\n                                let quad = tris_to_quad(tri_i, tri_j);\n\n                                // Compute diagonal edge length\n                                let diag = (mesh.vertices[vert] - mesh.vertices[other_vert]).norm();\n                                let max_length = (diag / sqrt_two) * max_non_squareness;\n                                let min_length = (diag / sqrt_two) * max_non_squareness.recip();\n\n                                let v0 = mesh.vertices[quad[0]];\n                                let v1 = mesh.vertices[quad[1]];\n                                let v2 = mesh.vertices[quad[2]];\n                                let v3 = mesh.vertices[quad[3]];\n\n                                let d0 = v1 - v0;\n                                let d1 = v2 - v1;\n                                let d2 = v3 - v2;\n                                let d3 = v0 - v3;\n\n                                let edge_ls = [d0.norm(), d1.norm(), d2.norm(), d3.norm()];\n\n                                let angles = [\n                                    quad_interior_angle(&v0, &v3, &v1, &v2),\n                                    quad_interior_angle(&v1, &v0, &v2, &v3),\n                                    quad_interior_angle(&v2, &v3, &v1, &v0),\n                                    quad_interior_angle(&v3, &v2, &v0, &v1),\n                                ];\n\n                                if edge_ls\n                                    .iter()\n                                    .all(|&edge_l| edge_l <= max_length && edge_l >= min_length)\n                                    && angles.iter().all(|&angle| angle <= max_interior_angle)\n                                {\n                                    convert = true;\n\n                                    let mut longest = edge_ls[0];\n                                    let mut shortest = edge_ls[0];\n\n                                    for l in edge_ls {\n                                        longest = longest.max(l);\n                                        shortest = shortest.min(l);\n                                    }\n\n                                    quality = shortest / longest;\n                                }\n                            }\n\n                            // Check normal deviation of triangles\n                            if convert {\n                                let dot_i_j = tri_normals[i].dot(&tri_normals[j]);\n                                convert = dot_i_j >= min_dot;\n                            }\n\n                            if convert {\n                                // Return the two triangle indices that should be merged\n                                return Some(((i, j), quality));\n                            }\n                        }\n                    }\n                }\n            }\n\n            None\n        })\n        .collect::<MapType<_, _>>();\n\n    info!(\n        \"Number of quad conversion candidates: {}\",\n        quad_candidates.len()\n    );\n\n    let mut triangles_to_remove = SetType::default();\n    let mut filtered_candidates = SetType::default();\n    for ((i, j), _q) in quad_candidates {\n        // TODO: If triangle already exists in list, compare quality\n\n        if !triangles_to_remove.contains(&i) && !triangles_to_remove.contains(&j) {\n            triangles_to_remove.insert(i);\n            triangles_to_remove.insert(j);\n\n            filtered_candidates.insert((i, j));\n        }\n    }\n\n    let quads: Vec<[usize; 4]> = filtered_candidates\n        .par_iter()\n        .copied()\n        .map(|(i, j)| {\n            let tri_i = &mesh.triangles[i];\n            let tri_j = &mesh.triangles[j];\n            tris_to_quad(tri_i, tri_j)\n        })\n        .collect::<_>();\n\n    let filtered_triangles = mesh\n        .triangles\n        .par_iter()\n        .copied()\n        .enumerate()\n        .filter_map(|(i, tri)| (!triangles_to_remove.contains(&i)).then_some(tri))\n        .collect::<Vec<_>>();\n\n    info!(\"Before conversion: {} triangles\", mesh.triangles.len());\n    info!(\n        \"After conversion: {} triangles, {} quads, {} total cells ({:.2}% fewer)\",\n        filtered_triangles.len(),\n        quads.len(),\n        filtered_triangles.len() + quads.len(),\n        (((mesh.triangles.len() - (filtered_triangles.len() + quads.len())) as f64)\n            / (mesh.triangles.len() as f64))\n            * 100.0\n    );\n\n    let mut cells = Vec::with_capacity(filtered_triangles.len() + quads.len());\n    cells.extend(filtered_triangles.into_iter().map(TriangleOrQuadCell::Tri));\n    cells.extend(quads.into_iter().map(TriangleOrQuadCell::Quad));\n\n    MixedTriQuadMesh3d {\n        vertices: mesh.vertices.clone(),\n        cells,\n    }\n}\n", "liquid/splashsurf/splashsurf_lib/src/kernel.rs": "//! SPH kernel function implementations\n//!\n//! Currently, the following SIMD implementations are provided:\n//!  - `CubicSplineKernelAvxF32`: Only available on `x86` and `x86_64` targets, requires AVX2 and FMA support\n//!  - `CubicSplineKernelNeonF32`: Only available on `aarch64` targets, requires NEON support\n//!\n//! Note that documentation of the SIMD kernels is only available on the respective target architectures.\n\nuse crate::{Real, RealConvert};\nuse nalgebra::Vector3;\nuse numeric_literals::replace_float_literals;\n\n#[cfg(all(target_arch = \"aarch64\"))]\nuse core::arch::aarch64::float32x4_t;\n\n#[cfg(target_arch = \"x86\")]\nuse core::arch::x86::__m256;\n#[cfg(target_arch = \"x86_64\")]\nuse core::arch::x86_64::__m256;\n\n// TODO: Add reference for the kernel function, document formula\n\n/// Utility functions for computing the volume of fluid particles\npub struct Volume;\n\nimpl Volume {\n    /// Returns the volume of a particle representing a cube of fluid\n    pub fn cube_particle<R: Real>(particle_radius: R) -> R {\n        (particle_radius + particle_radius).powi(3)\n    }\n\n    /// Returns the volume of a particle representing a sphere of fluid\n    pub fn sphere_particle<R: Real>(particle_radius: R) -> R {\n        R::from_float(4.0) * R::frac_pi_3() * particle_radius.powi(3)\n    }\n}\n\n/// Trait for symmetric kernel functions in three dimensions\npub trait SymmetricKernel3d<R: Real> {\n    /// Returns the compact support radius of the kernel\n    fn compact_support_radius(&self) -> R;\n    /// Evaluates the kernel at the radial distance `r` relative to the origin\n    fn evaluate(&self, r: R) -> R;\n    /// Evaluates the kernel gradient at the position `x` relative to the origin\n    fn evaluate_gradient(&self, x: Vector3<R>) -> Vector3<R>;\n    /// Evaluates the norm of the kernel gradient at the radial distance `r` relative to the origin, this may be faster than computing the full gradient\n    fn evaluate_gradient_norm(&self, r: R) -> R;\n}\n\n/// The commonly used cubic spline kernel\npub struct CubicSplineKernel<R: Real> {\n    /// Compact support radius of the kernel\n    compact_support_radius: R,\n    /// Kernel normalization factor (sigma)\n    normalization: R,\n}\n\nimpl<R: Real> CubicSplineKernel<R> {\n    /// Initializes a cubic spline kernel with the given compact support radius\n    #[replace_float_literals(R::from_float(literal))]\n    pub fn new(compact_support_radius: R) -> Self {\n        let h = compact_support_radius;\n        let sigma = 8.0 / (h * h * h);\n\n        Self {\n            compact_support_radius,\n            normalization: sigma,\n        }\n    }\n\n    /// The cubic spline function used by the cubic spline kernel\n    #[replace_float_literals(R::from_float(literal))]\n    fn cubic_function(q: R) -> R {\n        if q < R::one() {\n            (3.0 / (2.0 * R::pi())) * ((2.0 / 3.0) - q * q + 0.5 * q * q * q)\n        } else if q < 2.0 {\n            let x = 2.0 - q;\n            return (R::one() / (4.0 * R::pi())) * x * x * x;\n        } else {\n            return 0.0;\n        }\n    }\n\n    /// The derivative of the cubic spline function used by the cubic spline kernel w.r.t to the parameter `q`\n    #[replace_float_literals(R::from_float(literal))]\n    fn cubic_function_dq(q: R) -> R {\n        if q < 1.0 {\n            (3.0 / (4.0 * R::pi())) * (-4.0 * q + 3.0 * q * q)\n        } else if q < 2.0 {\n            let x = 2.0 - q;\n            return -(3.0 / (4.0 * R::pi())) * x * x;\n        } else {\n            return 0.0;\n        }\n    }\n}\n\nimpl<R: Real> SymmetricKernel3d<R> for CubicSplineKernel<R> {\n    fn compact_support_radius(&self) -> R {\n        self.compact_support_radius\n    }\n\n    /// Evaluates the cubic spline kernel at the radial distance `r`\n    fn evaluate(&self, r: R) -> R {\n        let q = (r + r) / self.compact_support_radius;\n        self.normalization * Self::cubic_function(q)\n    }\n\n    /// Evaluates the gradient of the cubic spline kernel at the position `x`\n    fn evaluate_gradient(&self, x: Vector3<R>) -> Vector3<R> {\n        // Kernel gradient is given by\n        //   df/dq * dq/dr * dr/dx\n        // where:\n        //   f is the cubic spline\n        //   q is the spline parameter\n        //   r is the radial distance\n        //   x is the position where the kernel gradient is evaluated\n\n        // Radial distance is norm of position\n        let r = x.norm();\n        // Normalize the position vector: points into direction of gradient due to symmetry\n        let drdx = x.unscale(r);\n\n        let q = (r + r) / self.compact_support_radius;\n\n        let dfdq = Self::cubic_function_dq(q);\n        let dqdr = (R::one() + R::one()) / self.compact_support_radius;\n\n        drdx.scale(self.normalization * dfdq * dqdr)\n    }\n\n    /// Evaluates the norm of the gradient of the cubic spline kernel at the radial distance `r`\n    fn evaluate_gradient_norm(&self, r: R) -> R {\n        let q = (r + r) / self.compact_support_radius;\n\n        let dfdq = Self::cubic_function_dq(q);\n        let dqdr = (R::one() + R::one()) / self.compact_support_radius;\n\n        self.normalization * dfdq * dqdr\n    }\n}\n\n#[test]\nfn test_cubic_kernel_r_compact_support() {\n    let hs = [0.025, 0.1, 2.0];\n    for &h in hs.iter() {\n        let kernel = CubicSplineKernel::new(h);\n        assert_eq!(kernel.evaluate(h), 0.0);\n        assert_eq!(kernel.evaluate(2.0 * h), 0.0);\n        assert_eq!(kernel.evaluate(10.0 * h), 0.0);\n    }\n}\n\n#[test]\nfn test_cubic_kernel_r_integral() {\n    let hs = [0.025, 0.1, 2.0];\n    let n = 10;\n\n    for &h in hs.iter() {\n        let kernel = CubicSplineKernel::new(h);\n\n        let dr = h / (n as f64);\n        let dvol = dr * dr * dr;\n\n        let mut integral = 0.0;\n        for i in -n..n {\n            for j in -n..n {\n                for k in -n..n {\n                    let r_in = Vector3::new(i as f64, j as f64, k as f64) * dr;\n                    let r_out = Vector3::new((i + 1) as f64, (j + 1) as f64, (k + 1) as f64) * dr;\n                    let r = ((r_in + r_out) * 0.5).norm();\n\n                    integral += dvol * kernel.evaluate(r);\n                }\n            }\n        }\n\n        assert!((integral - 1.0).abs() <= 1e-5);\n    }\n}\n\n/// Vectorized implementation of the cubic spline kernel using NEON instructions. Only available on `aarch64` targets.\n#[cfg(target_arch = \"aarch64\")]\npub struct CubicSplineKernelNeonF32 {\n    compact_support_inv: f32,\n    sigma: f32,\n}\n\n#[cfg(target_arch = \"aarch64\")]\nimpl CubicSplineKernelNeonF32 {\n    /// Initializes a cubic spline kernel with the given compact support radius\n    pub fn new(compact_support_radius: f32) -> Self {\n        let r = compact_support_radius;\n        let compact_support_inv = 1.0 / r;\n        let rrr = r * r * r;\n        let sigma = 8.0 / (std::f32::consts::PI * rrr);\n        Self {\n            compact_support_inv,\n            sigma,\n        }\n    }\n\n    /// Evaluates the cubic spline kernel at the specified radial distances\n    #[target_feature(enable = \"neon\")]\n    pub fn evaluate(&self, r: float32x4_t) -> float32x4_t {\n        use core::arch::aarch64::*;\n\n        let one = vdupq_n_f32(1.0);\n        let half = vdupq_n_f32(0.5);\n        let zero = vdupq_n_f32(0.0);\n\n        // q = r / h, v = 1 - q\n        let q = vmulq_n_f32(r, self.compact_support_inv);\n        let v = vsubq_f32(one, q);\n        // Clamp v to [0, 1] to implicitly zero-out contributions with q > 1\n        let v = vmaxq_f32(v, zero);\n\n        // Reuse v^2 and v^3 for both branches\n        let v2 = vmulq_f32(v, v);\n        let v3 = vmulq_f32(v2, v);\n\n        // Outer branch (0.5 < q <= 1.0): 2*sigma*(1 - q)^3 = 2*sigma*v^3\n        let res_outer = vmulq_n_f32(v3, 2.0 * self.sigma);\n\n        // Inner branch (q <= 0.5) rewritten in terms of v to avoid computing q^2:\n        // sigma * (1 - 6q^2 + 6q^3) == sigma * (1 - 6v + 12v^2 - 6v^3)\n        let mut res_inner = vdupq_n_f32(self.sigma);\n        res_inner = vmlsq_n_f32(res_inner, v, 6.0 * self.sigma); // -6*sigma*v\n        res_inner = vmlaq_n_f32(res_inner, v2, 12.0 * self.sigma); // +12*sigma*v^2\n        res_inner = vmlsq_n_f32(res_inner, v3, 6.0 * self.sigma); // -6*sigma*v^3\n\n        // Select inner for q <= 0.5, else outer; v was clamped so q > 1 yields 0 automatically\n        let leq_than_half = vcleq_f32(q, half);\n        vbslq_f32(leq_than_half, res_inner, res_outer)\n    }\n}\n\n#[test]\n#[cfg_attr(\n    not(all(target_arch = \"aarch64\", target_feature = \"neon\")),\n    ignore = \"Skipped on non-aarch64 targets\"\n)]\nfn test_cubic_spline_kernel_neon() {\n    #[cfg(all(target_arch = \"aarch64\", target_feature = \"neon\"))]\n    {\n        use core::arch::aarch64::*;\n\n        // Test a few representative compact support radii\n        let hs: [f32; 3] = [0.025, 0.1, 2.0];\n        for &h in hs.iter() {\n            let scalar = CubicSplineKernel::new(h);\n            let neon = CubicSplineKernelNeonF32::new(h);\n\n            // Sample radii from 0 to 2h (beyond support should be 0)\n            let n: usize = 1024;\n            let mut r0: f32 = 0.0;\n            let dr: f32 = (2.0 * h) / (n as f32);\n\n            for _chunk in 0..(n / 4) {\n                // Prepare 4 lanes of radii\n                let rs = [r0, r0 + dr, r0 + 2.0 * dr, r0 + 3.0 * dr];\n                let r_vec = unsafe { vld1q_f32(rs.as_ptr()) };\n\n                // Evaluate NEON and store back to array\n                let w_vec = unsafe { neon.evaluate(r_vec) };\n                let mut w_neon = [0.0f32; 4];\n                unsafe { vst1q_f32(w_neon.as_mut_ptr(), w_vec) };\n\n                // Compare against scalar lane-wise\n                for lane in 0..4 {\n                    let r_lane = rs[lane];\n                    let w_scalar = scalar.evaluate(r_lane);\n                    let diff = (w_neon[lane] - w_scalar).abs();\n\n                    // Absolute tolerance with mild relative component to be robust across scales\n                    let tol = 5e-6_f32.max(2e-5_f32 * w_scalar.abs());\n                    assert!(\n                        diff <= tol,\n                        \"NEON kernel mismatch (h={}, r={}, lane={}): neon={}, scalar={}, diff={}, tol={}\",\n                        h,\n                        r_lane,\n                        lane,\n                        w_neon[lane],\n                        w_scalar,\n                        diff,\n                        tol\n                    );\n                }\n\n                r0 += 4.0 * dr;\n            }\n\n            // Also check a couple of out-of-support points explicitly\n            for &r in &[h * 1.01, h * 1.5, h * 2.0, h * 2.5] {\n                let w_scalar = scalar.evaluate(r);\n                let w_neon = {\n                    let v = unsafe { vld1q_f32([r, r, r, r].as_ptr()) };\n                    let w = unsafe { neon.evaluate(v) };\n                    let mut tmp = [0.0f32; 4];\n                    unsafe { vst1q_f32(tmp.as_mut_ptr(), w) };\n                    tmp[0]\n                };\n                let diff = (w_neon - w_scalar).abs();\n                let tol = 5e-6_f32.max(1e-5_f32 * w_scalar.abs());\n                assert!(\n                    diff <= tol,\n                    \"NEON kernel mismatch outside support (h={}, r={}): neon={}, scalar={}, diff={}, tol={}\",\n                    h,\n                    r,\n                    w_neon,\n                    w_scalar,\n                    diff,\n                    tol\n                );\n            }\n        }\n    }\n}\n\n/// Vectorized implementation of the cubic spline kernel using AVX2 and FMA instructions. Only available on `x86` and `x86_64` targets.\n#[cfg(any(target_arch = \"x86_64\", target_arch = \"x86\"))]\npub struct CubicSplineKernelAvxF32 {\n    compact_support_inv: f32,\n    sigma: f32,\n}\n\n#[cfg(any(target_arch = \"x86_64\", target_arch = \"x86\"))]\nimpl CubicSplineKernelAvxF32 {\n    /// Initializes a cubic spline kernel with the given compact support radius\n    pub fn new(compact_support_radius: f32) -> Self {\n        let r = compact_support_radius;\n        let compact_support_inv = 1.0 / r;\n        let rrr = r * r * r;\n        let sigma = 8.0 / (std::f32::consts::PI * rrr);\n        Self {\n            compact_support_inv,\n            sigma,\n        }\n    }\n\n    /// Evaluates the cubic spline kernel at the specified radial distances\n    #[target_feature(enable = \"avx2,fma\")]\n    pub fn evaluate(&self, r: __m256) -> __m256 {\n        #[cfg(target_arch = \"x86\")]\n        use core::arch::x86::*;\n        #[cfg(target_arch = \"x86_64\")]\n        use core::arch::x86_64::*;\n\n        let one = _mm256_set1_ps(1.0);\n        let half = _mm256_set1_ps(0.5);\n        let zero = _mm256_set1_ps(0.0);\n\n        // q = r / h, v = 1 - q\n        let q = _mm256_mul_ps(r, _mm256_set1_ps(self.compact_support_inv));\n        let mut v = _mm256_sub_ps(one, q);\n        // Clamp v to [0, 1] to implicitly zero-out contributions with q > 1\n        v = _mm256_max_ps(v, zero);\n\n        // v^2 and v^3\n        let v2 = _mm256_mul_ps(v, v);\n        let v3 = _mm256_mul_ps(v2, v);\n\n        // Outer: 2*sigma*v^3\n        let res_outer = _mm256_mul_ps(v3, _mm256_set1_ps(2.0 * self.sigma));\n\n        // Inner: sigma * (1 - 6v + 12v^2 - 6v^3)\n        let mut res_inner = _mm256_set1_ps(self.sigma);\n        // res_inner = res_inner - 6*sigma*v\n        res_inner = _mm256_fnmadd_ps(v, _mm256_set1_ps(6.0 * self.sigma), res_inner);\n        // res_inner = res_inner + 12*sigma*v^2\n        res_inner = _mm256_fmadd_ps(v2, _mm256_set1_ps(12.0 * self.sigma), res_inner);\n        // res_inner = res_inner - 6*sigma*v^3\n        res_inner = _mm256_fnmadd_ps(v3, _mm256_set1_ps(6.0 * self.sigma), res_inner);\n\n        // Select inner for q <= 0.5, else outer\n        let leq_than_half = _mm256_cmp_ps::<_CMP_LE_OQ>(q, half);\n        _mm256_blendv_ps(res_outer, res_inner, leq_than_half)\n    }\n}\n\n#[test]\n#[cfg_attr(\n    not(all(\n        any(target_arch = \"x86_64\", target_arch = \"x86\"),\n        target_feature = \"avx2\",\n        target_feature = \"fma\"\n    )),\n    ignore = \"Skipped on non-x86 targets\"\n)]\nfn test_cubic_spline_kernel_avx() {\n    #[cfg(all(\n        any(target_arch = \"x86_64\", target_arch = \"x86\"),\n        target_feature = \"avx2\",\n        target_feature = \"fma\"\n    ))]\n    {\n        #[cfg(target_arch = \"x86\")]\n        use core::arch::x86::*;\n        #[cfg(target_arch = \"x86_64\")]\n        use core::arch::x86_64::*;\n\n        // Test a few representative compact support radii\n        let hs: [f32; 3] = [0.025, 0.1, 2.0];\n        for &h in hs.iter() {\n            let scalar = CubicSplineKernel::new(h);\n            let avx = CubicSplineKernelAvxF32::new(h);\n\n            // Sample radii from 0 to 2h (beyond support should be 0)\n            let n: usize = 1024;\n            let mut r0: f32 = 0.0;\n            let dr: f32 = (2.0 * h) / (n as f32);\n\n            for _chunk in 0..(n / 8) {\n                // Prepare 8 lanes of radii\n                let rs = [\n                    r0,\n                    r0 + dr,\n                    r0 + 2.0 * dr,\n                    r0 + 3.0 * dr,\n                    r0 + 4.0 * dr,\n                    r0 + 5.0 * dr,\n                    r0 + 6.0 * dr,\n                    r0 + 7.0 * dr,\n                ];\n\n                // Evaluate AVX and store back to array\n                let r_vec = unsafe { _mm256_loadu_ps(rs.as_ptr()) };\n                let w_vec = unsafe { avx.evaluate(r_vec) };\n                let mut w_avx = [0.0f32; 8];\n                unsafe { _mm256_storeu_ps(w_avx.as_mut_ptr(), w_vec) };\n\n                // Compare against scalar lane-wise\n                for lane in 0..8 {\n                    let r_lane = rs[lane];\n                    let w_scalar = scalar.evaluate(r_lane);\n                    let diff = (w_avx[lane] - w_scalar).abs();\n\n                    // Absolute tolerance with mild relative component to be robust across scales\n                    let tol = 1e-6_f32.max(1e-5_f32 * w_scalar.abs());\n                    assert!(\n                        diff <= tol,\n                        \"AVX kernel mismatch (h={}, r={}, lane={}): avx={}, scalar={}, diff={}, tol={}\",\n                        h,\n                        r_lane,\n                        lane,\n                        w_avx[lane],\n                        w_scalar,\n                        diff,\n                        tol\n                    );\n                }\n\n                r0 += 8.0 * dr;\n            }\n\n            // Also check a couple of out-of-support points explicitly\n            for &r in &[h * 1.01, h * 1.5, h * 2.0, h * 2.5] {\n                let w_scalar = scalar.evaluate(r);\n                let w_avx = {\n                    let v = unsafe { _mm256_set1_ps(r) };\n                    let w = unsafe { avx.evaluate(v) };\n                    let mut tmp = [0.0f32; 8];\n                    unsafe { _mm256_storeu_ps(tmp.as_mut_ptr(), w) };\n                    tmp[0]\n                };\n                let diff = (w_avx - w_scalar).abs();\n                let tol = 1e-6_f32.max(1e-5_f32 * w_scalar.abs());\n                assert!(\n                    diff <= tol,\n                    \"AVX kernel mismatch outside support (h={}, r={}): avx={}, scalar={}, diff={}, tol={}\",\n                    h,\n                    r,\n                    w_avx,\n                    w_scalar,\n                    diff,\n                    tol\n                );\n            }\n        }\n    }\n}\n\n/// Accelerator for efficient evaluation of a precomputed cubic kernel\n///\n/// This structure is used to pre-compute a discrete representation of the cubic kernel function.\n/// In some computations that require many evaluations of the kernel, it is more efficient to evaluate\n/// the kernel using a squared distance to avoid taking the square root.\n/// To produce an appropriate quantization of the kernel for this use case, the compact support\n/// radius of the kernel is divided into `n` segments with quadratically increasing width.\n/// To be more precise, on a quadratic scale, the compact support `[0, h*h]` is divided into `n` equally sized\n/// segments of width `dr`. For the actual pre-computation, the exact kernel `k(r)` is evaluated at the\n/// midpoint `m_i` of every segment given by `m_i = sqrt(i * dr)` for `i ∈ [0, n]`.\n/// This results in an array of kernel values `K` that can be evaluated at runtime using a squared radius\n/// `s` by just mapping this radius back to the corresponding segment index `i` followed by a lookup\n/// in the value array, i.e. `k(sqrt(s)) ≈ K[s/dr]` (while taking care of rounding and clamping to the\n/// allowed index range).\npub struct DiscreteSquaredDistanceCubicKernel<R: Real> {\n    /// Precomputed values of the kernel function\n    values: Vec<R>,\n    /// The radial resolution of the discretization on a quadratic scale\n    dr: R,\n}\n\nimpl<R: Real> DiscreteSquaredDistanceCubicKernel<R> {\n    /// Precomputes the discrete cubic kernel with compact support radius `h`, the squared radius `h * h` is divided into `n` segments for the quantization\n    pub fn new<PR: Real>(n: usize, h: R) -> Self {\n        let mut values = Vec::with_capacity(n);\n\n        let compact_support: PR = h\n            .try_convert()\n            .expect(\"Compact support radius `h` has to fit into kernel pre-computation type `PR`\");\n        let compact_support_squared = compact_support * compact_support;\n\n        let kernel = CubicSplineKernel::new(compact_support);\n\n        // Radial width of one discrete kernel value\n        let dr = compact_support_squared\n            / PR::from_usize(n)\n                .expect(\"Number of discrete kernel steps `n` has to fit into kernel pre-computation type `PR`\");\n        // Evaluate the kernel per discrete segment\n        for i in 0..n {\n            let i_and_half = PR::from_usize(i).unwrap() + PR::from_float(0.5);\n            let r_squared = dr * i_and_half;\n            let r = r_squared.sqrt();\n\n            let kernel_value = kernel.evaluate(r);\n            values.push(\n                kernel_value\n                    .try_convert()\n                    .expect(\"Kernel value has to fit into target type `R`\"),\n            );\n        }\n\n        let dr = dr.try_convert().unwrap();\n        Self { values, dr }\n    }\n\n    /// Evaluates the precomputed kernel function at the specified squared radius, i.e. returns an approximate cubic kernel value at the radius `sqrt(r_squared)`\n    #[inline(always)]\n    pub fn evaluate(&self, r_squared: R) -> R {\n        let normalized = (r_squared / self.dr).round();\n        let bin = normalized.to_usize().unwrap().min(self.values.len() - 1);\n        self.values[bin]\n    }\n}\n\n#[test]\nfn test_discrete_kernel() {\n    let n = 10000;\n    let h = 0.025;\n\n    let discrete_kernel = DiscreteSquaredDistanceCubicKernel::new::<f64>(n, h);\n    let kernel = CubicSplineKernel::new(h);\n\n    // Test the pre-computed values using a linear stepping\n    let dr = h / (n as f64);\n    for i in 0..n {\n        let r = (i as f64) * dr;\n        let rr = r * r;\n\n        let discrete = discrete_kernel.evaluate(rr);\n        let continuous = kernel.evaluate(r);\n\n        let diff = (discrete - continuous).abs();\n        let rel_diff = diff / continuous;\n        if rel_diff > 5e-2 && diff > 1e-1 {\n            eprintln!(\n                \"at r={}, r/h={}, discrete: {}, continuous: {}, diff: {}, rel_diff: {}\",\n                r,\n                r / h,\n                discrete,\n                continuous,\n                diff,\n                rel_diff\n            );\n            assert!(false);\n        }\n    }\n}\n", "liquid/splashsurf/splashsurf_lib/examples/minimal_sph_levelset.rs": "//! Example with a simple multithreaded marching cubes implementation for reconstruction of particle data from SPH simulations.\n//!\n//! Note that this example only reconstructs a triangle soup for a simpler and faster implementation.\n\nuse anyhow::anyhow;\nuse clap::Parser;\nuse log::info;\nuse rayon::prelude::*;\n#[cfg(feature = \"io\")]\nuse splashsurf_lib::io;\nuse splashsurf_lib::kernel::SymmetricKernel3d;\nuse splashsurf_lib::marching_cubes::marching_cubes_lut::marching_cubes_triangulation_iter;\nuse splashsurf_lib::mesh::TriMesh3d;\nuse splashsurf_lib::nalgebra::Vector3;\nuse splashsurf_lib::uniform_grid::UniformCartesianCubeGrid3d;\nuse splashsurf_lib::{Aabb3d, UniformGrid, kernel};\nuse splashsurf_lib::{Real, profile};\nuse std::cell::RefCell;\nuse std::sync::atomic::{AtomicU32, Ordering};\nuse thread_local::ThreadLocal;\n\n// The real type used for the reconstruction, can be changed to f64 if higher precision is needed\ntype R = f32;\n// The index type used for the grid\ntype I = i64;\n\n#[derive(Clone, Debug, clap::Parser)]\nstruct CommandlineArgs {\n    /// The input file containing the particle data\n    #[arg(long, short = 'i')]\n    pub input_file: String,\n    /// The output file to write the reconstructed mesh to\n    #[arg(long, short = 'o')]\n    pub output_file: String,\n    /// Whether to output the level set function values on the marching cubes grid instead of the triangulated mesh\n    #[arg(long)]\n    pub output_levelset: bool,\n    /// The particle radius of the input data\n    #[arg(short = 'r', long)]\n    pub particle_radius: R,\n    /// The rest density of the fluid\n    #[arg(long, default_value = \"1000.0\")]\n    pub rest_density: R,\n    /// The smoothing length radius used for the SPH kernel, the kernel compact support radius will be twice the smoothing length (in multiples of the particle radius)\n    #[arg(short = 'l', long)]\n    pub smoothing_length: R,\n    /// The cube edge length used for marching cubes in multiples of the particle radius, corresponds to the cell size of the implicit background grid\n    #[arg(short = 'c', long)]\n    pub cube_size: R,\n    /// The iso-surface threshold for the density, i.e., the normalized value of the reconstructed density level that indicates the fluid surface (in multiples of the rest density)\n    #[arg(short = 't', long, default_value = \"0.6\")]\n    pub surface_threshold: R,\n}\n\npub enum LevelSetSign {\n    Inside,\n    Outside,\n}\n\n/// Interface that has to be provided by a level set to be reconstructed using marching cubes\npub trait MarchingCubesLevelSet<R: Real> {\n    /// Returns the sign of the level set function at the given coordinate\n    fn evaluate_sign(&self, coordinate: &Vector3<R>) -> LevelSetSign;\n    /// Returns the value of the level set function at the given coordinate\n    fn evaluate(&self, coordinate: &Vector3<R>) -> R;\n}\n\n/// Reconstructs a triangle soup from a level set function\npub fn marching_cubes<R: Real, L: MarchingCubesLevelSet<R> + Send + Sync>(\n    level_set: L,\n    grid: &UniformCartesianCubeGrid3d<I, R>,\n) -> Result<TriMesh3d<R>, anyhow::Error> {\n    profile!(\"marching_cubes\");\n\n    let mut mesh = TriMesh3d::default();\n    let level_set = &level_set;\n\n    let vertices = ThreadLocal::<RefCell<Vec<Vector3<R>>>>::new();\n    let triangles = ThreadLocal::<RefCell<Vec<[usize; 3]>>>::new();\n\n    let n_cells = grid.cells_per_dim().iter().product();\n    let cell_indices = (0..n_cells).into_iter().collect::<Vec<_>>();\n\n    info!(\"Starting to process {} cells\", cell_indices.len());\n    print!(\"Start: \");\n    cell_indices.par_chunks(5000).for_each(|chunk| {\n        let vertices = vertices.get_or(|| RefCell::new(Vec::new()));\n        let mut mut_vertices = vertices.borrow_mut();\n        let triangles = triangles.get_or(|| RefCell::new(Vec::new()));\n        let mut mut_triangles = triangles.borrow_mut();\n\n        for i in chunk.iter().copied() {\n            if let Some(cell) = grid.try_unflatten_cell_index(i) {\n                let mut vertices_inside = [true; 8];\n                for local_point_index in 0..8 {\n                    let point = cell.global_point_index_of(local_point_index).unwrap();\n                    let coords = grid.point_coordinates(&point);\n\n                    match level_set.evaluate_sign(&coords) {\n                        LevelSetSign::Inside => vertices_inside[local_point_index] = true,\n                        LevelSetSign::Outside => vertices_inside[local_point_index] = false,\n                    }\n                }\n\n                for triangle in marching_cubes_triangulation_iter(&vertices_inside) {\n                    let mut global_triangle = [0; 3];\n                    for (v_idx, local_edge_index) in triangle.iter().copied().enumerate() {\n                        let edge = cell\n                            .global_edge_index_of(local_edge_index as usize)\n                            .unwrap();\n                        let vertex_index = {\n                            let vertex_index = mut_vertices.len();\n\n                            let origin_coords = grid.point_coordinates(edge.origin());\n                            let target_coords = grid.point_coordinates(&edge.target());\n\n                            let origin_value = level_set.evaluate(&origin_coords);\n                            let target_value = level_set.evaluate(&target_coords);\n\n                            let diff = target_value - origin_value;\n                            let c = (origin_value / diff).abs();\n                            let p = origin_coords + (target_coords - origin_coords) * c;\n\n                            let vertex_coords = p;\n                            mut_vertices.push(vertex_coords);\n                            vertex_index\n                        };\n                        global_triangle[v_idx] = vertex_index;\n                    }\n                    mut_triangles.push(global_triangle);\n                }\n            }\n        }\n\n        print!(\"+\");\n    });\n    println!();\n\n    info!(\"Merging thread local results...\");\n    for (vertices, triangles) in vertices.into_iter().zip(triangles.into_iter()) {\n        let vertex_offset = mesh.vertices.len();\n\n        let vertices = vertices.into_inner();\n        let triangles = triangles.into_inner();\n\n        mesh.vertices.extend(vertices);\n        for triangle in triangles {\n            let mut global_triangle = [0; 3];\n            for (v_idx, vertex_index) in triangle.iter().enumerate() {\n                global_triangle[v_idx] = vertex_offset + vertex_index;\n            }\n            mesh.triangles.push(global_triangle);\n        }\n    }\n\n    Ok(mesh)\n}\n\npub struct MarchingCubesGrid {\n    pub grid: UniformCartesianCubeGrid3d<I, R>,\n    pub values: Vec<R>,\n    pub threshold: R,\n}\n\nimpl MarchingCubesLevelSet<f32> for MarchingCubesGrid {\n    fn evaluate_sign(&self, coordinate: &Vector3<f32>) -> LevelSetSign {\n        let rel_coordinate = (coordinate - self.grid.aabb().min()) / self.grid.cell_size();\n        let ijk = [\n            rel_coordinate.x.round() as I,\n            rel_coordinate.y.round() as I,\n            rel_coordinate.z.round() as I,\n        ];\n\n        if let Some(index) = self.grid.get_point(ijk) {\n            let index: usize = self.grid.flatten_point_index(&index).try_into().unwrap();\n            if self.values[index] < self.threshold {\n                LevelSetSign::Outside\n            } else {\n                LevelSetSign::Inside\n            }\n        } else {\n            LevelSetSign::Outside\n        }\n    }\n\n    fn evaluate(&self, coordinate: &Vector3<f32>) -> f32 {\n        let rel_coordinate = (coordinate - self.grid.aabb().min()) / self.grid.cell_size();\n        let ijk = [\n            rel_coordinate.x.round() as I,\n            rel_coordinate.y.round() as I,\n            rel_coordinate.z.round() as I,\n        ];\n\n        if let Some(index) = self\n            .grid\n            .get_point(ijk)\n            .map(|p| self.grid.flatten_point_index(&p))\n        {\n            let index: usize = index.try_into().unwrap();\n            self.values[index] - self.threshold\n        } else {\n            f32::MIN // or some other value indicating outside\n        }\n    }\n}\n\nfn reconstruct() -> Result<(), anyhow::Error> {\n    profile!(\"reconstruct\");\n\n    let args = CommandlineArgs::parse();\n    info!(\"Command line args: {args:?}\");\n\n    info!(\"Loading particles from: \\\"{}\\\"\", args.input_file);\n    let particles = io::particles_from_file::<f32, _>(args.input_file)?;\n    info!(\"Loaded {} particles\", particles.len());\n\n    let cube_size = args.cube_size * args.particle_radius;\n    let compact_support_radius = 2.0 * args.smoothing_length * args.particle_radius;\n\n    let mut particle_aabb = Aabb3d::par_from_points(&particles);\n    info!(\n        \"Minimal enclosing bounding box of particles was computed as: {:?}\",\n        particle_aabb\n    );\n\n    // Ensure that we have enough margin around the particles such that the every particle's kernel support is completely in the domain\n\n    // The number of cells in each direction from a particle that can be affected by its compact support\n    let half_supported_cells_real = (compact_support_radius / cube_size).ceil() as R;\n    // Convert to index type for cell and point indexing\n    let half_supported_cells: I = half_supported_cells_real.to_index_unchecked();\n\n    // The total number of cells per dimension that can be affected by a particle's compact support\n    let supported_cells: I = half_supported_cells * 2 + 1;\n    // The number of points corresponding to the number of supported cells\n    let supported_points: I = 1 + supported_cells;\n\n    // Evaluate kernel in a smaller domain, points outside of this radius have to be assumed to be outside the iso-surface\n    let kernel_evaluation_radius =\n        cube_size * half_supported_cells_real * (1.0 + R::EPSILON.sqrt());\n\n    particle_aabb.grow_uniformly(kernel_evaluation_radius);\n\n    let grid = UniformGrid::<I, R>::from_aabb(&particle_aabb, cube_size)?;\n    let kernel = kernel::CubicSplineKernel::new(compact_support_radius);\n\n    let particle_rest_volume = kernel::Volume::cube_particle(args.particle_radius);\n    let particle_rest_mass = particle_rest_volume * args.rest_density;\n\n    info!(\n        \"Evaluating level set function on grid with a total of {} grid vertices...\",\n        grid.points_per_dim().iter().product::<I>()\n    );\n\n    let particle_densities = {\n        profile!(\"compute_particle_densities\");\n        let mut densities = vec![0.0; particles.len()];\n\n        let mut nl = Vec::with_capacity(particles.len());\n        splashsurf_lib::neighborhood_search::neighborhood_search_spatial_hashing_parallel::<I, R>(\n            grid.aabb(),\n            &particles,\n            compact_support_radius,\n            &mut nl,\n        );\n\n        {\n            profile!(\"density_loop\");\n            densities.par_iter_mut().enumerate().for_each(|(i, den)| {\n                *den += particle_rest_mass * kernel.evaluate(0.0);\n                for j in nl[i].iter() {\n  project is to create an easy-to-use, lightweight, cross-browser, general-purpose 3D library. The current builds only include WebGL and WebGPU renderers but SVG and CSS3D renderers are also available as addons.\n\n[Examples](https://threejs.org/examples/) &mdash;\n[Docs](https://threejs.org/docs/) &mdash;\n[Manual](https://threejs.org/manual/) &mdash;\n[Wiki](https://github.com/mrdoob/three.js/wiki) &mdash;\n[Migrating](https://github.com/mrdoob/three.js/wiki/Migration-Guide) &mdash;\n[Questions](https://stackoverflow.com/questions/tagged/three.js) &mdash;\n[Forum](https://discourse.threejs.org/) &mdash;\n[Discord](https://discord.gg/56GBJwAnUS)\n\n### Usage\n\nThis code creates a scene, a camera, and a geometric cube, and it adds the cube to the scene. It then creates a `WebGL` renderer for the scene and camera, and it adds that viewport to the `document.body` element. Finally, it animates the cube within the scene for the camera.\n\n```javascript\nimport * as THREE from 'three';\n\nconst width = window.innerWidth, height = window.innerHeight;\n\n// init\n\nconst camera = new THREE.PerspectiveCamera( 70, width / height, 0.01, 10 );\ncamera.position.z = 1;\n\nconst scene = new THREE.Scene();\n\nconst geometry = new THREE.BoxGeometry( 0.2, 0.2, 0.2 );\nconst material = new THREE.MeshNormalMaterial();\n\nconst mesh = new THREE.Mesh( geometry, material );\nscene.add( mesh );\n\nconst renderer = new THREE.WebGLRenderer( { antialias: true } );\nrenderer.setSize( width, height );\nrenderer.setAnimationLoop( animate );\ndocument.body.appendChild( renderer.domElement );\n\n// animation\n\nfunction animate( time ) {\n\n\tmesh.rotation.x = time / 2000;\n\tmesh.rotation.y = time / 1000;\n\n\trenderer.render( scene, camera );\n\n}\n```\n\nIf everything goes well, you should see [this](https://jsfiddle.net/w43x5Lgh/).\n\n### Cloning this repository\n\nCloning the repo with all its history results in a ~2 GB download. If you don't need the whole history you can use the `depth` parameter to significantly reduce download size.\n\n```sh\ngit clone --depth=1 https://github.com/mrdoob/three.js.git\n```\n\n### Change log\n\n[Releases](https://github.com/mrdoob/three.js/releases)\n\n\n[npm]: https://img.shields.io/npm/v/three\n[npm-url]: https://www.npmjs.com/package/three\n[build-size]: https://badgen.net/bundlephobia/minzip/three\n[build-size-url]: https://bundlephobia.com/result?p=three\n[npm-downloads]: https://img.shields.io/npm/dw/three\n[npmtrends-url]: https://www.npmtrends.com/three\n[jsdelivr-downloads]: https://data.jsdelivr.com/v1/package/npm/three/badge?style=rounded\n[jsdelivr-url]: https://www.jsdelivr.com/package/npm/three\n[discord]: https://img.shields.io/discord/685241246557667386\n[discord-url]: https://discord.gg/56GBJwAnUS\n", "flow/Waterways/addons/waterways/buoyant_manager.gd": "# Copyright © 2021 Kasper Arnklit Frandsen - MIT License\n# See `LICENSE.md` included in the source distribution for details.\ntool\nextends Spatial\n\nconst WaterSystem = preload(\"res://addons/waterways/water_system_manager.gd\")\n\n\nexport var water_system_group_name : String = \"waterways_system\"\nexport(float, 0.0, 200.0) var buoyancy_force := 50.0\nexport(float, 0.0, 20.0) var up_correcting_force := 5.0\nexport(float, 0.0, 200.0) var flow_force := 50.0\nexport(float, 0.0, 30.0) var water_resistance := 5.0\n\nvar _rb : RigidBody\nvar _system : WaterSystem\nvar _default_linear_damp := -1.0\nvar _default_angular_damp := -1.0\n\n\nfunc _enter_tree() -> void:\n\tvar parent = get_parent()\n\tif parent is RigidBody:\n\t\t_rb = parent as RigidBody\n\t\t_default_linear_damp = _rb.linear_damp\n\t\t_default_angular_damp = _rb.angular_damp\n\n\nfunc _exit_tree() -> void:\n\t_rb = null\n\n\nfunc _ready() -> void:\n\tvar systems = get_tree().get_nodes_in_group(water_system_group_name)\n\tif systems.size() > 0:\n\t\tif systems[0] is WaterSystem:\n\t\t\t_system = systems[0] as WaterSystem\n\n\nfunc _get_configuration_warning() -> String:\n\tif _rb == null:\
