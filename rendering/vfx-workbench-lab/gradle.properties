org.gradle.daemon=false
systemProp.net.minecraftforge.gradle.check.certs=false

# The JDK's AF_UNIX loopback pipe fails when java.io.tmpdir resolves to an 8.3
# short path (C:\Users\NOSTZE~1\...), so selectors cannot open and Gradle cannot
# start its daemon. Point the Unix-domain socket dir at a stable ASCII path.
systemProp.jdk.net.unixdomain.tmpdir=C:/Temp
